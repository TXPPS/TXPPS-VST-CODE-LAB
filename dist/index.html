<title>TXPPS VST CODE LAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>/* ============================================================
   TXPPS VST CODE LAB — studio-at-night design system
   Committed single-theme dark interface (deliberate choice:
   the whole product is a night-session studio rack).
   ============================================================ */
:root {
  --bg0: #0A0C0F;      /* studio black — page ground */
  --bg1: #12151A;      /* rack panel charcoal */
  --bg2: #181D24;      /* raised module surface */
  --bg3: #20262F;      /* highest surface / pressed */
  --line: #2A313B;     /* panel seams */
  --line-soft: #20252d;
  --ink: #EAE4D4;      /* warm cream */
  --ink-dim: #A29D8F;  /* warm gray */
  --ink-faint: #857F6E;
  --phos: #5DE894;     /* phosphor green — instrument light */
  --phos-dim: #2E8757;
  --phos-glow: rgba(93, 232, 148, 0.13);
  --amber: #F0B450;    /* warning / streak / locks */
  --amber-glow: rgba(240, 180, 80, 0.12);
  --red: #F07862;      /* clip LED — errors */
  --red-glow: rgba(240, 120, 98, 0.12);
  --code-kw: #F0B450;
  --code-num: #5DE894;
  --code-str: #D8B48A;
  --code-com: #6E6A5F;
  --code-pre: #8FB8D8;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --rad: 10px;
  --rad-sm: 6px;
  --tap: 44px;
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg0);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
  min-height: 100vh;
}
/* faint scanline texture over the whole surface */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
  z-index: 0;
}

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--phos);
  outline-offset: 2px;
}
input, textarea, select { font-family: inherit; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.25; }
::selection { background: var(--phos-dim); color: var(--ink); }

.app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; min-height: 100vh; }

/* ---------- top rack strip ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px calc(10px);
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: linear-gradient(180deg, var(--bg1), rgba(18,21,26,0.92));
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
  color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.brand b { color: var(--phos); font-weight: 700; }
.brand .led {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--phos); box-shadow: 0 0 6px var(--phos);
  flex: none;
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.xp-chip {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
  color: var(--ink-dim); display: flex; align-items: center; gap: 7px;
}
.xp-chip .lvl { color: var(--phos); font-weight: 700; }
.vu { width: 64px; height: 8px; background: var(--bg0); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.vu > i { display: block; height: 100%; background: linear-gradient(90deg, var(--phos-dim), var(--phos)); transition: width 0.5s ease; }
.streak-chip { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: 0.04em; white-space: nowrap; }
.icon-btn {
  min-width: var(--tap); min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--rad-sm); color: var(--ink-dim);
}
.icon-btn:active { background: var(--bg3); }

/* ---------- main scroll area ---------- */
.main {
  padding: 16px 14px calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  animation: viewin 0.22s ease;
}
@keyframes viewin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  animation-duration: 0.01ms !important; transition-duration: 0.01ms !important;
}

/* ---------- bottom transport tab bar ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex; justify-content: center;
  background: linear-gradient(0deg, var(--bg1), rgba(18,21,26,0.94));
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { display: flex; width: 100%; max-width: 760px; }
.tab {
  flex: 1; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  color: var(--ink-faint);
  border-top: 2px solid transparent;
}
.tab svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.tab.on { color: var(--phos); border-top-color: var(--phos); }
.tab:active { background: var(--bg2); }

/* ---------- cards & modules ---------- */
.card {
  background: var(--bg1);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 16px;
}
.card.raised { background: var(--bg2); }
.card-tap { display: block; width: 100%; text-align: left; transition: border-color 0.15s; }
.card-tap:active { background: var(--bg2); border-color: var(--phos-dim); }
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-faint);
  display: flex; align-items: center; gap: 8px;
}
.eyebrow.phos { color: var(--phos); }
.eyebrow.amber { color: var(--amber); }
.eyebrow.red { color: var(--red); }
.h-display {
  font-family: var(--mono); letter-spacing: 0.04em;
  font-size: 19px; font-weight: 700;
}
.h-sub { font-size: 14px; color: var(--ink-dim); }
.divider-wave { height: 18px; opacity: 0.5; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px;
  font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: var(--rad-sm);
  border: 1px solid var(--line);
  background: var(--bg2); color: var(--ink);
  transition: transform 0.06s, background 0.15s;
  touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: linear-gradient(180deg, #1d3a2a, #16281f);
  border-color: var(--phos-dim);
  color: var(--phos);
  box-shadow: 0 0 0 1px rgba(93,232,148,0.08), 0 4px 14px rgba(0,0,0,0.4);
}
.btn.primary:active { background: #16281f; }
.btn.amber { border-color: var(--amber); color: var(--amber); background: rgba(240,180,80,0.06); }
.btn.danger { border-color: var(--red); color: var(--red); background: rgba(240,120,98,0.06); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 11.5px; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }

/* ---------- code panel ---------- */
.code {
  background: #0B0E12;
  border: 1px solid var(--line);
  border-radius: var(--rad-sm);
  overflow: hidden;
}
.code-head {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  color: var(--ink-faint); text-transform: uppercase;
}
.code-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.code pre {
  margin: 0; padding: 12px 12px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: var(--code-fs, 13px);
  line-height: 1.62;
  color: var(--ink);
  -webkit-overflow-scrolling: touch;
  tab-size: 4;
}
.code-s .code pre, .code-s.code pre { --code-fs: 12px; }
.code-l .code pre, .code-l.code pre { --code-fs: 14.5px; }
.tok-kw { color: var(--code-kw); }
.tok-num { color: var(--code-num); }
.tok-str { color: var(--code-str); }
.tok-com { color: var(--code-com); font-style: italic; }
.tok-pre { color: var(--code-pre); }
.tok-fn { color: var(--ink); font-weight: 600; }

/* tappable code lines (bug hunt) */
.codeline {
  display: block; width: 100%; text-align: left;
  font-family: var(--mono); font-size: var(--code-fs, 13px); line-height: 1.5;
  padding: 7px 10px 7px 8px;
  border: none; border-left: 3px solid transparent;
  color: var(--ink); white-space: pre; overflow-x: auto; max-width: 100%;
}
.codeline .ln { color: var(--ink-faint); display: inline-block; width: 2em; user-select: none; }
.codeline.sel { background: var(--phos-glow); border-left-color: var(--phos); }
.codeline.hit { background: var(--red-glow); border-left-color: var(--red); }
.codeline.good { background: var(--phos-glow); border-left-color: var(--phos); }
.codeline:focus-visible { outline-offset: -2px; }

/* inline blank in fill challenges */
.blank-input {
  width: 100%;
  background: #0B0E12;
  border: 1px solid var(--phos-dim);
  border-radius: var(--rad-sm);
  color: var(--phos);
  font-family: var(--mono); font-size: 16px; /* >=16px stops iOS focus zoom */
  padding: 12px;
  min-height: var(--tap);
}
.blank-input::placeholder { color: var(--ink-faint); }
.blank-mark { color: var(--phos); background: var(--phos-glow); border-radius: 3px; padding: 0 4px; }

/* ---------- simulated compiler panel ---------- */
.compiler {
  background: #100D08;
  border: 1px solid var(--amber);
  border-radius: var(--rad-sm);
  overflow: hidden;
}
.compiler-head {
  padding: 6px 10px;
  background: var(--amber-glow);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  color: var(--amber); text-transform: uppercase;
  display: flex; align-items: center; gap: 7px;
}
.compiler pre {
  margin: 0; padding: 12px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.6;
  color: var(--amber);
  -webkit-overflow-scrolling: touch;
}
.compiler pre .err { color: var(--red); font-weight: 700; }

/* ---------- MCQ options ---------- */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 11px;
  width: 100%; text-align: left;
  min-height: var(--tap);
  padding: 13px 14px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--rad-sm);
  font-size: 14.5px; line-height: 1.45;
  transition: border-color 0.12s, background 0.12s;
}
.opt .key {
  flex: none; width: 24px; height: 24px; margin-top: 1px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 5px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
}
.opt code { font-family: var(--mono); font-size: 0.92em; color: var(--phos); background: rgba(93,232,148,0.07); padding: 1px 4px; border-radius: 3px; }
.opt.sel { border-color: var(--phos); background: var(--phos-glow); }
.opt.sel .key { border-color: var(--phos); color: var(--phos); }
.opt.right { border-color: var(--phos); background: var(--phos-glow); }
.opt.right .key { border-color: var(--phos); color: var(--phos); }
.opt.wrong { border-color: var(--red); background: var(--red-glow); }
.opt.wrong .key { border-color: var(--red); color: var(--red); }
.opt:disabled { cursor: default; opacity: 1; }
.opt.faded { opacity: 0.45; }

/* ---------- ordering ---------- */
.order-list { display: flex; flex-direction: column; gap: 8px; }
.order-row {
  display: flex; align-items: stretch; gap: 8px;
}
.order-line {
  flex: 1; display: flex; align-items: center;
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--rad-sm);
  padding: 10px 12px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.4;
  overflow-x: auto; white-space: pre;
  -webkit-overflow-scrolling: touch;
}
.order-row.right .order-line { border-color: var(--phos); background: var(--phos-glow); }
.order-row.wrong .order-line { border-color: var(--red); background: var(--red-glow); }
.order-ctl { display: flex; flex-direction: column; gap: 4px; }
.order-ctl button {
  width: 44px; flex: 1; min-height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3); border: 1px solid var(--line); border-radius: 5px;
  color: var(--ink-dim); font-size: 13px;
}
.order-ctl button:active { color: var(--phos); border-color: var(--phos-dim); }
.order-ctl button:disabled { opacity: 0.3; }

/* ---------- match pairs ---------- */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match-item {
  min-height: var(--tap);
  padding: 10px 11px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--rad-sm);
  font-size: 13px; line-height: 1.35; text-align: left;
  display: flex; align-items: center;
}
.match-item.code { font-family: var(--mono); font-size: 12px; color: var(--phos); }
.match-item.sel { border-color: var(--amber); background: var(--amber-glow); }
.match-item.paired { border-color: var(--phos-dim); background: var(--phos-glow); opacity: 0.85; }
.match-item.wrongpair { border-color: var(--red); background: var(--red-glow); }

/* ---------- feedback panel ---------- */
.feedback {
  border-radius: var(--rad-sm);
  padding: 13px 14px;
  font-size: 14px; line-height: 1.5;
  border: 1px solid;
  animation: viewin 0.18s ease;
}
.feedback.ok { border-color: var(--phos-dim); background: var(--phos-glow); }
.feedback.bad { border-color: var(--red); background: var(--red-glow); }
.feedback.info { border-color: var(--amber); background: var(--amber-glow); }
.feedback .fb-head {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 6px; display: flex; align-items: center; gap: 7px;
}
.feedback.ok .fb-head { color: var(--phos); }
.feedback.bad .fb-head { color: var(--red); }
.feedback.info .fb-head { color: var(--amber); }
.feedback code { font-family: var(--mono); font-size: 0.9em; color: var(--phos); background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; }

/* ---------- lesson content ---------- */
.prose { font-size: 15px; line-height: 1.62; max-width: 62ch; }
.prose strong { color: var(--ink); }
.prose code { font-family: var(--mono); font-size: 0.9em; color: var(--phos); background: rgba(93,232,148,0.08); padding: 1px 5px; border-radius: 3px; }
.callout {
  border-left: 3px solid var(--phos); border-radius: 0 var(--rad-sm) var(--rad-sm) 0;
  background: var(--bg2); padding: 11px 13px; font-size: 14px; line-height: 1.55;
}
.callout.analogy { border-left-color: var(--phos); }
.callout.mistake { border-left-color: var(--red); }
.callout.warn { border-left-color: var(--amber); }
.callout .co-head {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 5px;
}
.callout.analogy .co-head { color: var(--phos); }
.callout.mistake .co-head { color: var(--red); }
.callout.warn .co-head { color: var(--amber); }

/* lesson hook — the familiar studio situation */
.hook {
  font-size: 16.5px; line-height: 1.55; color: var(--ink);
  border-left: 3px solid var(--phos);
  padding: 4px 2px 4px 14px;
}

/* diagram wrapper */
.viz-wrap {
  background: #07090B;
  border: 1px solid var(--line);
  border-radius: var(--rad-sm);
  padding: 10px 8px 6px;
}
.viz-wrap svg { display: block; width: 100%; height: auto; }
.viz-cap {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-faint);
  padding: 6px 4px 2px;
}

/* piece-by-piece code breakdown (sits under a code panel) */
.breakdown {
  border: 1px solid var(--line-soft);
  border-radius: var(--rad-sm);
  background: #0B0E12;
  padding: 10px 12px;
  margin-top: -6px;
  display: flex; flex-direction: column; gap: 7px;
}
.bd-head {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em;
  color: var(--ink-faint);
}
.bd-row { display: flex; gap: 10px; align-items: baseline; font-size: 13px; line-height: 1.4; }
.bd-code {
  font-family: var(--mono); font-size: 11.5px; color: var(--phos);
  flex: none; width: 118px; overflow-wrap: break-word;
}
.bd-what { color: var(--ink-dim); }

/* end-of-lesson panels */
.callout.remember {
  border-left-color: var(--phos);
  background: linear-gradient(90deg, rgba(93,232,148,0.09), var(--bg2));
}
.callout.remember .co-head { color: var(--phos); }
.callout.remember .co-body { font-size: 15.5px; color: var(--ink); line-height: 1.5; }
.plugin-use { display: flex; gap: 10px; align-items: baseline; }
.pu-name {
  flex: none; width: 92px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--phos);
}
.pu-desc { font-size: 13.5px; color: var(--ink-dim); line-height: 1.45; }

/* progress dots inside lesson */
.dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dots i {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--line);
}
.dots i.done { background: var(--phos); border-color: var(--phos); }
.dots i.now { border-color: var(--phos); box-shadow: 0 0 5px var(--phos-glow); background: var(--bg1); }

/* ---------- map ---------- */
.zone-rack {
  border: 1px solid var(--line); border-radius: var(--rad);
  background: var(--bg1); overflow: hidden;
}
.zone-head {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 15px;
}
.zone-num {
  flex: none; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--phos-dim); border-radius: 7px;
  font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--phos);
}
.zone-rack.locked .zone-num { border-color: var(--line); color: var(--ink-faint); }
.zone-title { font-family: var(--mono); font-size: 13.5px; font-weight: 700; letter-spacing: 0.06em; }
.zone-tag { font-size: 12.5px; color: var(--ink-dim); }
.zone-meta { margin-left: auto; text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); flex: none; }
.node-list { border-top: 1px solid var(--line-soft); }
.node-row {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 15px; min-height: 56px;
  border-bottom: 1px solid var(--line-soft);
}
.node-row:last-child { border-bottom: none; }
.node-row:active { background: var(--bg2); }
.node-row.locked { opacity: 0.5; }
.node-ico {
  flex: none; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px; border: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; color: var(--ink-dim);
}
.node-ico.lesson { color: var(--phos); border-color: var(--phos-dim); }
.node-ico.challenge { color: var(--amber); border-color: var(--amber); }
.node-ico.project { color: var(--code-pre); border-color: var(--code-pre); }
.node-ico.boss { color: var(--red); border-color: var(--red); }
.node-name { font-size: 14px; line-height: 1.3; }
.node-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.node-right { margin-left: auto; flex: none; display: flex; align-items: center; gap: 8px; }

.stars { font-size: 12px; letter-spacing: 2px; color: var(--amber); font-family: var(--mono); white-space: nowrap; }
.stars .off { color: var(--bg3); -webkit-text-stroke: 0.5px var(--line); }

/* ---------- meters / stats ---------- */
.meter { height: 10px; background: var(--bg0); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--phos-dim), var(--phos)); transition: width 0.5s ease; }
.meter.amber > i { background: linear-gradient(90deg, #8a6526, var(--amber)); }

/* ===== src/js/engine.js ===== */
/* ============================================================
   Challenge engine — pure logic, no DOM.
   Builds the question index and evaluates answers deterministically.
   All "compiler" feedback in this app is simulated and labeled so.
   ============================================================ */

const Engine = (() => {

  /* ---- content index ------------------------------------------------ */
  // NODES: id -> node object (lesson/challenge/project/boss)
  // QINDEX: qid -> { q, nodeId, ctx } for practice/daily reuse
  const NODES = {};
  const QINDEX = {};

  function indexAll() {
    const all = [...ZONE1_LESSONS, ...ZONE1_CHALLENGES];
    for (const node of all) {
      NODES[node.id] = node;
      const qs = questionsOf(node);
      qs.forEach((q, i) => {
        const qid = node.id + '.q' + (i + 1);
        q.qid = qid;
        QINDEX[qid] = { q, nodeId: node.id };
      });
    }
  }

  function questionsOf(node) {
    if (node.kind === 'lesson') return node.checks;
    if (node.kind === 'challenge') return node.questions;
    if (node.kind === 'project') return node.steps.map((s) => s.q);
    if (node.kind === 'boss') return node.stages;
    return [];
  }

  /* ---- deterministic shuffle (stable per qid) ------------------------ */
  function seedFrom(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function seededShuffle(arr, seedStr) {
    const a = arr.slice();
    let s = seedFrom(seedStr) || 1;
    const rnd = () => {
      // xorshift32
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Shuffled order for an `order` question; guaranteed != correct order.
  function shuffledOrder(q) {
    const idx = q.lines.map((_, i) => i);
    let out = seededShuffle(idx, q.qid || q.prompt);
    if (out.every((v, i) => v === i)) out = seededShuffle(idx, (q.qid || q.prompt) + 'x');
    if (out.every((v, i) => v === i)) out.reverse();
    return out;
  }

  // Shuffled right-column order for a `match` question.
  function shuffledMatch(q) {
    const idx = q.right.map((_, i) => i);
    let out = seededShuffle(idx, (q.qid || q.prompt) + 'm');
    if (out.every((v, i) => v === i)) out.reverse();
    return out;
  }

  /* ---- answer normalization & evaluation ----------------------------- */
  function normalize(s) {
    return String(s || '')
      .replace(/ /g, ' ')
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .trim()
      .replace(/\s+/g, ' ');
  }

  // Loose form: also drop spaces entirely and any single trailing semicolon,
  // so `output[i]=input[i]*gain` matches `output[i] = input[i] * gain;`.
  function loose(s) {
    return normalize(s).replace(/;\s*$/, '').replace(/\s+/g, '');
  }

  function evalFill(q, input) {
    const raw = normalize(input);
    if (!raw) return { correct: false, empty: true, msg: 'Type an answer first.' };

    // Known-mistake patterns get targeted feedback.
    if (q.mistakes) {
      for (const m of q.mistakes) {
        let re = null;
        try { re = new RegExp(m.match, 'i'); } catch (e) { re = null; }
        if (re && re.test(raw)) {
          // Only report as a mistake if it isn't also an accepted answer.
          const isAccepted = q.accept.some((a) => loose(a) === loose(raw));
          if (!isAccepted) return { correct: false, msg: m.msg };
        }
      }
    }
    if (q.forbidden && q.forbidden.some((f) => raw.includes(f))) {
      return { correct: false, msg: 'Not quite — check the hint and look again at the bounds.' };
    }
    const ok = q.accept.some((a) => loose(a) === loose(raw));
    return { correct: ok, msg: ok ? q.explain : null };
  }

  function evalMcq(q, chosenIndex) {
    return { correct: chosenIndex === q.answer };
  }

  function evalOrder(q, arrangement) {
    // arrangement: array of original line indexes, top to bottom.
    const wrong = [];
    arrangement.forEach((orig, pos) => { if (orig !== pos) wrong.push(pos); });
    return { correct: wrong.length === 0, wrongPositions: wrong };
  }

  function evalBugspot(q, lineIndex) {
    return { correct: lineIndex === q.buggy };
  }

  function evalMatch(q, pairs) {
    // pairs: array where pairs[leftIndex] = rightIndex chosen.
    const wrong = [];
    q.left.forEach((_, li) => { if (pairs[li] !== li) wrong.push(li); });
    return { correct: wrong.length === 0, wrongLeft: wrong };
  }

  /* ---- daily challenge ----------------------------------------------- */
  function dailyQid(dateStr) {
    const pool = DAILY_POOL.filter((qid) => QINDEX[qid]);
    if (pool.length === 0) return null;
    return pool[seedFrom(dateStr) % pool.length];
  }

  /* ---- zone helpers --------------------------------------------------- */
  function zoneNodes(zoneId) {
    const z = ZONES.find((z2) => z2.id === zoneId);
    if (!z || !z.nodeOrder) return [];
    return z.nodeOrder.map((id) => NODES[id]).filter(Boolean);
  }

  indexAll();

  return {
    NODES, QINDEX, questionsOf, zoneNodes, dailyQid,
    shuffledOrder, shuffledMatch,
    evalFill, evalMcq, evalOrder, evalBugspot, evalMatch,
    seedFrom,
  };
})();

/* ===== src/js/store.js ===== */
/* ============================================================
   Progress store — state, XP/levels/mastery/streak, persistence.
   localStorage is wrapped defensively: if unavailable (private
   browsing, sandbox), the app runs on an in-memory fallback.
   ============================================================ */

const Store = (() => {
  const KEY = 'txpps_vst_code_lab_v1';
  let memoryFallback = null;
  let storageOk = true;

  function defaults() {
    return {
      v: 1,
      xp: 0,
      nodes: {},          // nodeId -> {done, stars, attempts, firstTry, checks, step}
      weak: {},           // qid -> {nodeId, concept, misses, ts}
      streak: { count: 0, last: '' },
      daily: {},          // dateStr -> {qid, done, correct}
      dailyDone: 0,
      achievements: [],
      settings: { sound: true, motion: true, codeSize: 'm' },
      practiceCleared: 0,
      dictViewed: [],
      createdAt: new Date().toISOString(),
    };
  }

  /* ---- safe persistence ---- */
  function rawLoad() {
    try {
      const s = window.localStorage.getItem(KEY);
      return s ? JSON.parse(s) : null;
    } catch (e) {
      storageOk = false;
      return memoryFallback ? JSON.parse(memoryFallback) : null;
    }
  }

  function rawSave(obj) {
    const json = JSON.stringify(obj);
    try {
      window.localStorage.setItem(KEY, json);
      storageOk = true;
    } catch (e) {
      storageOk = false;
      memoryFallback = json;
    }
  }

  // Merge loaded data over defaults so missing/renamed fields never crash.
  function sanitize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const s = { ...d, ...raw };
    s.xp = Number.isFinite(s.xp) && s.xp >= 0 ? Math.floor(s.xp) : 0;
    s.nodes = (s.nodes && typeof s.nodes === 'object') ? s.nodes : {};
    s.weak = (s.weak && typeof s.weak === 'object') ? s.weak : {};
    s.daily = (s.daily && typeof s.daily === 'object') ? s.daily : {};
    s.streak = (s.streak && typeof s.streak === 'object') ? { count: s.streak.count | 0, last: String(s.streak.last || '') } : d.streak;
    s.achievements = Array.isArray(s.achievements) ? s.achievements.filter((a) => typeof a === 'string') : [];
    s.settings = { ...d.settings, ...(s.settings && typeof s.settings === 'object' ? s.settings : {}) };
    s.dailyDone = s.dailyDone | 0;
    s.practiceCleared = s.practiceCleared | 0;
    if (!['s', 'm', 'l'].includes(s.settings.codeSize)) s.settings.codeSize = 'm';
    s.dictViewed = Array.isArray(s.dictViewed) ? s.dictViewed.filter((x) => typeof x === 'string') : [];
    // deep-clean per-entry shapes so a hand-edited import can't poison renders
    const nodes = {};
    for (const [k, v] of Object.entries(s.nodes)) {
      if (v && typeof v === 'object') {
        nodes[k] = {
          done: !!v.done,
          stars: Math.max(0, Math.min(3, v.stars | 0)),
          attempts: Math.max(0, v.attempts | 0),
          firstTry: Math.max(0, v.firstTry | 0),
          checks: Math.max(0, v.checks | 0),
          step: Math.max(0, v.step | 0),
        };
      }
    }
    s.nodes = nodes;
    const weak = {};
    for (const [k, v] of Object.entries(s.weak)) {
      if (v && typeof v === 'object') {
        weak[k] = {
          nodeId: String(v.nodeId || ''),
          concept: String(v.concept || ''),
          misses: Math.max(0, v.misses | 0),
          ts: Number.isFinite(v.ts) ? v.ts : 0,
        };
      }
    }
    s.weak = weak;
    const daily = {};
    for (const [k, v] of Object.entries(s.daily)) {
      if (v && typeof v === 'object') {
        daily[k] = { qid: typeof v.qid === 'string' ? v.qid : null, done: !!v.done, correct: !!v.correct };
      }
    }
    s.daily = daily;
    return s;
  }

  let state = sanitize(rawLoad());

  function save() { rawSave(state); }

  /* ---- date helpers ---- */
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function touchStreak() {
    const today = todayStr();
    const last = state.streak.last;
    if (last === today) return;
    if (last) {
      const diff = Math.round((new Date(today) - new Date(last)) / 86400000);
      state.streak.count = (diff === 1) ? state.streak.count + 1 : 1;
    } else {
      state.streak.count = 1;
    }
    state.streak.last = today;
    if (state.streak.count >= 3) grant('hot_streak');
    if (state.streak.count >= 7) grant('studio_regular');
    save();
  }

  /* ---- XP & levels ---- */
  function level() {
    let lv = 1;
    for (let i = 0; i < LEVELS.length; i++) if (state.xp >= LEVELS[i]) lv = i + 1;
    return lv;
  }

  function levelTitle() { return LEVEL_TITLES[Math.min(level() - 1, LEVEL_TITLES.length - 1)]; }

  function levelProgress() {
    const lv = level();
    const base = LEVELS[lv - 1];
    const next = LEVELS[lv] !== undefined ? LEVELS[lv] : null;
    if (next === null) return { pct: 100, into: 0, span: 0, next: null };
    return { pct: Math.min(100, Math.round(((state.xp - base) / (next - base)) * 100)), into: state.xp - base, span: next - base, next };
  }

  function addXp(amount) {
    const before = level();
    state.xp += Math.max(0, Math.round(amount));
    if (state.xp >= 100) grant('signal_present');
    if (level() >= 5) grant('level_5');
    touchStreak();
    save();
    return { leveledUp: level() > before, level: level() };
  }

  /* ---- nodes ---- */
  function nodeState(id) {
    if (!state.nodes[id]) state.nodes[id] = { done: false, stars: 0, attempts: 0, firstTry: 0, checks: 0, step: 0 };
    return state.nodes[id];
  }

  function isDone(id) { return !!(state.nodes[id] && state.nodes[id].done); }

  // Sequential unlock within a zone. Everything before the first
  // incomplete node is replayable; the first incomplete node is next.
  function isUnlocked(zoneId, nodeId) {
    const order = (ZONES.find((z) => z.id === zoneId) || {}).nodeOrder || [];
    for (const id of order) {
      if (id === nodeId) return true;
      if (!isDone(id)) return false;
    }
    return false;
  }

  function nextNode() {
    const order = ZONES[0].nodeOrder;
    for (const id of order) if (!isDone(id)) return id;
    return null;
  }

  function starsFor(firstTry, checks) {
    if (checks <= 0) return 1;
    const f = firstTry / checks;
    if (f >= 0.999) return 3;
    if (f >= 0.66) return 2;
    return 1;
  }

  function completeNode(id, firstTry, checks) {
    const ns = nodeState(id);
    const stars = starsFor(firstTry, checks);
    const firstCompletion = !ns.done;
    ns.done = true;
    ns.attempts += 1;
    ns.firstTry = firstTry;
    ns.checks = checks;
    ns.stars = Math.max(ns.stars, stars);
    ns.step = 0;
    const node = Engine.NODES[id];
    if (node) {
      if (node.kind === 'lesson') {
        grant('power_on');
        if (stars === 3) grant('clean_take');
      }
      if (id === 'p1') grant('gain_staged');
      if (id === 'p2') grant('osc_online');
      if (id === 'boss1') grant('zone1_clear');
      if (node.ctype === 'bugfix' && ['b1', 'b2', 'b3', 'b4'].every(isDone)) grant('bug_squasher');
      if (node.ctype === 'compiler' && ['e1', 'e2', 'e3'].every(isDone)) grant('error_reader');
    }
    save();
    return { stars, firstCompletion };
  }

  function setProjectStep(id, step) {
    nodeState(id).step = step;
    save();
  }

  /* ---- weak topics / practice ---- */
  function markWeak(qid, nodeId, concept) {
    const w = state.weak[qid] || { nodeId, concept, misses: 0, ts: 0 };
    w.misses += 1;
    w.ts = Date.now();
    w.concept = concept || w.concept;
    state.weak[qid] = w;
    save();
  }

  function clearWeak(qid) {
    if (state.weak[qid]) {
      delete state.weak[qid];
      state.practiceCleared += 1;
      save();
    }
  }

  function weakList() {
    return Object.entries(state.weak)
      .map(([qid, w]) => ({ qid, ...w }))
      .filter((w) => Engine.QINDEX[w.qid])
      .sort((a, b) => b.misses - a.misses || b.ts - a.ts);
  }

  function weakConcepts() {
    const counts = {};
    for (const w of weakList()) counts[w.concept] = (counts[w.concept] || 0) + 1;
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) => ({ concept: c, n }));
  }

  /* ---- daily ---- */
  function dailyToday() {
    const t = todayStr();
    if (!state.daily[t]) {
      const qid = Engine.dailyQid(t);
      state.daily[t] = { qid, done: false, correct: false };
      save();
    }
    return { date: t, ...state.daily[t] };
  }

  function completeDaily(dateStr, correct) {
    const t = dateStr || todayStr();
    if (state.daily[t] && !state.daily[t].done) {
      state.daily[t].done = true;
      state.daily[t].correct = !!correct;
      state.dailyDone += 1;
      if (state.dailyDone >= 5) grant('daily_driver');
      save();
    }
  }

  /* ---- achievements ---- */
  let achQueue = [];
  function grant(id) {
    if (!ACHIEVEMENTS.some((a) => a.id === id)) return;
    if (state.achievements.includes(id)) return;
    state.achievements.push(id);
    achQueue.push(id);
    save();
  }
  function drainAchievements() { const q = achQueue; achQueue = []; return q; }

  /* ---- mastery ---- */
  function zoneMastery() {
    const lessons = ZONE1_LESSONS.map((l) => l.id);
    const doneLessons = lessons.filter(isDone);
    if (doneLessons.length === 0) return { pct: 0, avgStars: 0, doneLessons: 0, totalLessons: lessons.length };
    const totalStars = doneLessons.reduce((s, id) => s + (state.nodes[id].stars || 0), 0);
    const avg = totalStars / doneLessons.length;
    return {
      pct: Math.round((totalStars / (lessons.length * 3)) * 100),
      avgStars: avg,
      doneLessons: doneLessons.length,
      totalLessons: lessons.length,
    };
  }

  function bossReady() {
    const m = zoneMastery();
    const lessonsDone = m.doneLessons === m.totalLessons;
    const projectsDone = isDone('p1') && isDone('p2');
    return { ready: lessonsDone && projectsDone && m.avgStars >= 2, lessonsDone, projectsDone, avgStars: m.avgStars, need: 2 };
  }

  /* ---- settings / io ---- */
  function setSetting(k, v) { state.settings[k] = v; save(); }

  function markDictViewed(id) {
    if (!state.dictViewed.includes(id)) {
      state.dictViewed.push(id);
      save();
    }
  }

  function exportJson() { return JSON.stringify(state, null, 2); }

  function importJson(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'That isn\'t valid JSON — paste the exact text from Export Progress.' }; }
    if (!obj || typeof obj !== 'object' || typeof obj.xp !== 'number') {
      return { ok: false, error: 'That JSON doesn\'t look like TXPPS progress data (missing xp field).' };
    }
    state = sanitize(obj);
    save();
    return { ok: true };
  }

  function reset() {
    state = defaults();
    try { window.localStorage.removeItem(KEY); } catch (e) { /* fallback mode */ }
    memoryFallback = null;
    save();
  }

  return {
    get state() { return state; },
    get storageOk() { return storageOk; },
    save, todayStr, touchStreak,
    level, levelTitle, levelProgress, addXp,
    nodeState, isDone, isUnlocked, nextNode, completeNode, setProjectStep, starsFor,
    markWeak, clearWeak, weakList, weakConcepts,
    dailyToday, completeDaily,
    grant, drainAchievements,
    zoneMastery, bossReady,
    setSetting, markDictViewed, exportJson, importJson, reset,
  };
})();

/* ===== src/js/audio.js ===== */
/* ============================================================
   Feedback tones — tiny WebAudio blips. Created lazily on first
   user gesture (iOS requirement); fully optional via Settings.
   ============================================================ */

const Sfx = (() => {
  let ctx = null;

  function ensure() {
    if (!Store.state.settings.sound) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }

  function blip(freq, time, dur, type, gain) {
    const c = ensure();
    if (!c) return;
    try {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(gain || 0.08, time + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(c.destination);
      o.start(time);
      o.stop(time + dur + 0.02);
    } catch (e) { /* sound is never worth crashing over */ }
  }

  return {
    tap()     { const c = ensure(); if (c) blip(880, c.currentTime, 0.05, 'sine', 0.03); },
    correct() { const c = ensure(); if (c) { blip(660, c.currentTime, 0.09, 'sine', 0.07); blip(990, c.currentTime + 0.07, 0.14, 'sine', 0.07); } },
    wrong()   { const c = ensure(); if (c) blip(140, c.currentTime, 0.16, 'square', 0.04); },
    levelUp() { const c = ensure(); if (c) { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => blip(f, c.currentTime + i * 0.09, 0.18, 'triangle', 0.07)); } },
  };
})();

/* ===== src/js/ui.js ===== */
/* ============================================================
   UI helpers — element builder, markup formatter, C++ highlighter,
   shared widgets (code panel, stars, toast, sheet, scope canvas).
   ============================================================ */

const UI = (() => {

  /* ---- element builder ---- */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;

      s.push(arrow(200, 44, 256, 66));
      [[24, o.aName || 'Filter a', o.a || 'cutoff: 200', 0.25], [216, o.bName || 'Filter b', o.b || 'cutoff: 2000', 0.85]].forEach(([x, name, val, amt]) => {

      s.push(`<path d="M 16 40 L 190 40 C 215 40, 210 24, 225 24 C 240 24, 238 84, 260 84 L 262 84" fill="none" stroke="${C.phos}" stroke-width="1.8"/>`);
      s.push(`<line x1="225" y1="12" x2="225" y2="84" stroke="${C.amber}" stroke-width="1" stroke-dasharray="4 3"/>`);
      s.push(txt(225, 104, 'cutoff', C.amber, 9, 'middle'));

      s.push(txt(170, 118, 'low-pass: lows through, highs reduced past the cutoff', C.faint, 9, 'middle'));

    voices(o) {
      const s = [];
      s.push(txt(170, 14, o && o.steal ? '9th NOTE ARRIVES — ALL 8 BUSY' : 'VOICE POOL', C.dim, 9, 'middle', 1.5));
      for (let i = 0; i < 8; i++) {
        const x = 26 + i * 37;
        const busy = i < (o && o.steal ? 8 : 5);
        const stolen = o && o.steal && i === 0;
        s.push(box(x, 24, 32, 34, stolen ? C.red : (busy ? C.phosDim : C.line), stolen, busy && !stolen ? 'rgba(93,232,148,0.06)' : 'none'));
        s.push(txt(x + 16, 45, stolen ? '↻' : (busy ? '♪' : '·'), stolen ? C.red : (busy ? C.phos : C.faint), 11, 'middle'));
        s.push(txt(x + 16, 70, 'v' + (i + 1), C.faint, 8, 'middle'));
      }
      s.push(txt(170, 90, o && o.steal ? 'oldest voice fades fast, then plays the new note' : 'each ♪ is one object of your Voice class', C.faint, 9, 'middle'));
      return { svg: s.join(''), h: 96 };
    },

    // A key press becoming a MIDI message.
    midimsg() {
      const s = [];
      for (let i = 0; i < 5; i++) {
        const x = 16 + i * 20;
        const pressed = i === 2;
        s.push(box(x, 16, 17, 44, pressed ? C.phosDim : C.line, false, pressed ? 'rgba(93,232,148,0.1)' : 'none'));
      }
      s.push(txt(66, 74, 'you press C4', C.faint, 8.5, 'middle'));
      s.push(arrow(122, 38, 158, 38));
      s.push(box(164, 14, 162, 48, C.amber, false, 'rgba(240,180,80,0.05)'));
      s.push(txt(245, 30, 'NOTE ON', C.amber, 9.5, 'middle', 1.5));
      s.push(txt(245, 46, 'note: 60   velocity: 100', C.dim, 9.5, 'middle'));
      s.push(txt(245, 74, 'a message — not a sound', C.faint, 8.5, 'middle'));
      return { svg: s.join(''), h: 84 };
    },

    // Two layers: front panel (public / header) over circuitry (private / cpp).
    twoLayer(o) {
      const s = [];
      s.push(box(20, 12, 300, 40, C.phosDim, false, 'rgba(93,232,148,0.04)'));
      [56, 84, 112].forEach((x) => s.push(`<circle cx="${x}" cy="32" r="6" fill="none" stroke="${C.phos}" stroke-width="1.4"/>`));
      s.push(txt(305, 30, o.top || 'front panel — what everyone sees', C.phos, 9.5, 'end'));
      s.push(txt(305, 44, o.topSub || '', C.dim, 8.5, 'end'));
      s.push(box(20, 60, 300, 40, C.line));
      s.push(`<path d="M 40 80 h 24 v -8 h 20 v 16 h 22 v -8 h 18" fill="none" stroke="${C.faint}" stroke-width="1.2"/>`);
      s.push(txt(305, 78, o.bottom || 'circuitry inside — hidden', C.dim, 9.5, 'end'));
      s.push(txt(305, 92, o.bottomSub || '', C.faint, 8.5, 'end'));
      if (o.caption) s.push(txt(170, 118, o.caption, C.faint, 9, 'middle'));
      return { svg: s.join(''), h: o.caption ? 124 : 108 };
    },
  };

  function render(spec) {
    const gen = GEN[spec.t];
    const wrap = document.createElement('div');
    wrap.className = 'viz-wrap';
    wrap.setAttribute('aria-hidden', 'true');
    if (!gen) return wrap;
    try {
      const { svg, h } = gen(spec);
      wrap.innerHTML = `<svg viewBox="0 0 340 ${h}" preserveAspectRatio="xMidYMid meet">${svg}</svg>` +
        (spec.cap ? `<div class="viz-cap">${esc(spec.cap)}</div>` : '');
    } catch (e) { /* a broken diagram must never break a lesson */ }
    return wrap;
  }

  return { render };
})();

/* ============================================================
   Dict — Signal Dictionary logic: index, mastery computation,
   scored search, abbreviation auto-linking, and the entry card
   (rendered in the existing bottom-sheet pattern).
   ============================================================ */

const Dict = (() => {
  const byId = {};
  DICT.forEach((e) => { byId[e.id] = e; });

  const LEVELS_ = [
    { glyph: '○', label: 'never seen' },
    { glyph: '◔', label: 'introduced' },
    { glyph: '◑', label: 'practiced' },
    { glyph: '◕', label: 'learned' },
    { glyph: '●', label: 'mastered' },
  ];

  const ZONE_TITLES = { 1: 'C++ Signal Path', 2: 'Modern C++ for Audio', 3: 'JUCE Plugin Foundation', 4: 'DSP Workshop', 5: 'Synth Engineering', 6: 'Professional Plugin Engineering', 7: 'Final Product Missions' };

  /* ---- mastery: derived from lesson progress + views ---- */
  function z1Nodes(entry) {
    return (entry.appears || []).filter((a) => a.z === 1 && a.node && Engine.NODES[a.node]);
  }

  function masteryLevel(entry) {
    const viewed = (Store.state.dictViewed || []).includes(entry.id);
    const nodes = z1Nodes(entry);
    if (nodes.length === 0) return viewed ? 1 : 0;
    const done = nodes.filter((n) => Store.isDone(n.node));
    const anyUnlocked = nodes.some((n) => Store.isUnlocked('z1', n.node));
    if (done.length === 0) return (viewed || anyUnlocked) ? 1 : 0;
    if (done.length < nodes.length) return 2;
    const weak = Store.weakList().some((w) => nodes.some((n) => n.node === w.nodeId));
    if (weak) return 2;
    const avg = done.reduce((s, n) => s + ((Store.state.nodes[n.node] || {}).stars || 0), 0) / done.length;
    if (avg >= 2.999) return 4;
    if (avg >= 2) return 3;
    return 2;
  }

  function mastery(entry) {
    const lvl = masteryLevel(entry);
    return { level: lvl, ...LEVELS_[lvl] };
  }

  /* ---- search: term > full/aka > keywords > body text ---- */
  function search(query, cat) {
    const q = String(query || '').trim().toLowerCase();
    let list = DICT.filter((e) => cat === 'ALL' || e.c === cat);
    if (!q) return list.slice().sort((a, b) => a.t.localeCompare(b.t));
    const scored = [];
    for (const e of list) {
      const t = e.t.toLowerCase();
      let score = 0;
      if (t === q) score = 120;
      else if (t.startsWith(q)) score = 100;
      else if (t.includes(q)) score = 85;
      if (score < 75) {
        const names = [e.full || '', ...(e.aka || [])].map((x) => x.toLowerCase());
        if (names.some((n) => n && (n.includes(q) || q.includes(n)))) score = Math.max(score, 75);
      }
      if (score < 60) {
        const kws = (e.search || []).map((x) => x.toLowerCase());
        if (kws.some((k) => k.includes(q) || q.includes(k))) score = Math.max(score, 60);
      }
      if (score < 30) {
        const body = (e.plain + ' ' + e.why + ' ' + e.studio).toLowerCase();
        if (body.includes(q)) score = 30;
      }
      if (score > 0) scored.push([score, e]);
    }
    return scored.sort((a, b) => b[0] - a[0] || a[1].t.localeCompare(b[1].t)).map(([, e]) => e);
  }

  /* ---- abbreviation auto-linking in prose (first mention per block) ---- */
  const LINKABLE = [
    ['APVTS', 'apvts'], ['VST3', 'vst3'], ['AUv3', 'auv3'], ['CMake', 'cmake'],
    ['MIDI', 'midi'], ['JUCE', 'juce'], ['ADSR', 'envelope'], ['AAX', 'aax'],
    ['DSP', 'dsp'], ['DAW', 'daw'], ['GUI', 'gui'], ['CPU', 'cpu'],
    ['RAM', 'ram'], ['API', 'api'], ['IDE', 'ide'], ['LFO', 'lfo'], ['VST', 'vst'],
  ];

  function autoLink(html) {
    // Split into tag / text segments; skip linking inside <code> and existing links.
    const parts = String(html).split(/(<[^>]+>)/);
    let inCode = 0;
    const linked = new Set();
    for (let i = 0; i < parts.length; i++) {
      const seg = parts[i];
      if (seg.startsWith('<')) {
        if (/^<code[\s>]/i.test(seg)) inCode++;
        else if (/^<\/code>/i.test(seg)) inCode = Math.max(0, inCode - 1);
        continue;
      }
      if (inCode || !seg) continue;
      let out = seg;
      for (const [abbr, id] of LINKABLE) {
        if (linked.has(abbr) || !byId[id]) continue;
        const re = new RegExp('\\b' + abbr + '\\b');
        if (re.test(out)) {
          out = out.replace(re, '<span class="term-link" role="link" tabindex="0" data-term="' + id + '">' + abbr + '</span>');
          linked.add(abbr);
        }
      }
      parts[i] = out;
    }
    return parts.join('');
  }

  /* ---- the entry card (bottom sheet) ---- */
  let currentSheet = null;

  function open(id) {
    const e = byId[id];
    if (!e) { UI.toast('Term not found in the dictionary'); return; }
    if (currentSheet) { currentSheet.close(); currentSheet = null; }
    Store.markDictViewed(e.id);
    const { el, fmt } = UI;
    const m = mastery(e);

    const bits = [];
    bits.push(el('div', { class: 'row between' },
      el('span', { class: 'eyebrow phos' }, 'SIGNAL DICTIONARY'),
      el('span', { class: 'mono small', style: 'color:var(--amber)', 'aria-label': 'mastery: ' + m.label }, m.glyph + ' ' + m.label.toUpperCase())));
    bits.push(el('div', null,
      el('div', { class: 'h-display' }, e.t),
      e.full ? el('div', { class: 'dict-full' }, e.full) : null,
      el('div', { class: 'mt-s' }, el('span', { class: 'chip' }, e.c))));

    bits.push(el('div', null,
      el('div', { class: 'eyebrow' }, 'PLAIN ENGLISH'),
      el('p', { class: 'prose mt-s', style: 'font-size:14.5px', html: fmt(e.plain) })));

    bits.push(el('div', null,
      el('div', { class: 'eyebrow amber' }, 'WHY IT MATTERS FOR YOUR VST'),
      el('p', { class: 'small mt-s', style: 'color:var(--ink-dim); line-height:1.55; max-width:62ch', html: fmt(e.why) })));

    if (e.studio) bits.push(el('div', { class: 'callout analogy' },
      el('div', { class: 'co-head' }, '🎹 STUDIO TAKE'),
      el('div', { html: fmt(e.studio) })));

    if (e.viz) bits.push(Viz.render(e.viz));

    if (e.uses && e.uses.length) bits.push(el('div', null,
      el('div', { class: 'eyebrow' }, 'REAL PLUGIN USE'),
      el('div', { class: 'chips mt-s' }, e.uses.map((u) => el('span', { class: 'chip' }, u)))));

    if (e.mistake) bits.push(el('div', { class: 'callout mistake' },
      el('div', { class: 'co-head' }, '⚠ COMMON BEGINNER MISTAKE'),
      el('div', { html: fmt(e.mistake) })));

    if (e.remember) bits.push(el('div', { class: 'callout remember' },
      el('div', { class: 'co-head' }, '💡 REMEMBER THIS'),
      el('div', { class: 'co-body', html: fmt(e.remember) })));

    const rel = (e.related || []).filter((r) => byId[r]);
    if (rel.length) bits.push(el('div', null,
      el('div', { class: 'eyebrow' }, 'RELATED TERMS'),
      el('div', { class: 'chips mt-s' }, rel.map((r) =>
        el('button', { class: 'chip', style: 'color:var(--phos); border-color:var(--phos-dim)', onclick: () => { Sfx.tap(); open(r); } }, '→ ' + byId[r].t)))));

    if (e.appears && e.appears.length) {
      bits.push(el('div', null,
        el('div', { class: 'eyebrow' }, 'APPEARS IN THE CURRICULUM'),
        el('div', { class: 'col mt-s', style: 'gap:2px' }, e.appears.map((a) => {
          const node = a.node ? Engine.NODES[a.node] : null;
          const live = a.z === 1 && node;
          const label = node ? node.title : (a.label || '');
          const unlocked = live && Store.isUnlocked('z1', a.node);
          const done = live && Store.isDone(a.node);
          return el('button', { class: 'appears-row', onclick: () => {
            if (!live) { UI.toast('Zone ' + a.z + ' ships in a future update'); return; }
            if (!unlocked) { UI.toast('Locked — progress through the map first'); return; }
            if (currentSheet) { currentSheet.close(); currentSheet = null; }
            App.openNode(a.node);
          } },
            el('span', { class: 'z-badge' + (live ? ' live' : '') }, 'Z' + a.z),
            el('div', { style: 'min-width:0; text-align:left' },
              el('div', { class: 'small' }, label),
              el('div', { class: 'mono', style: 'font-size:9.5px; color:var(--ink-faint); letter-spacing:.08em' }, ZONE_TITLES[a.z] || '')),
            el('span', { class: 'mono small', style: 'margin-left:auto; color:' + (done ? 'var(--phos)' : 'var(--ink-faint)') },
              live ? (done ? '✓' : (unlocked ? '▶' : '🔒')) : 'SOON'));
        }))));
    }

    currentSheet = UI.sheet(bits);
    return currentSheet;
  }

  return { byId, mastery, search, autoLink, open, LEVELS: LEVELS_ };
})();

/* ===== src/js/views.js ===== */
/* ============================================================
   Views — every screen + the shared question runner.
   All views are functions returning a DOM element; App handles
   routing, the top bar and the tab bar.
   ============================================================ */

const Views = (() => {
  const { el, fmt } = UI;

  /* =====================================================================
     QUESTION RUNNER — one component for all 7 interaction types.
     opts: { onResolved({correct, firstTry, revealed, attempts}),
             onWrongAttempt(), maxAttempts (default: unlimited w/ reveal
             offered after 2 wrong), allowReveal (default true) }
     ===================================================================== */
  const PRAISE = ['Correct — clean take', 'Correct — nailed it', 'Correct — that\'s the one', 'Correct — locked in', 'Correct — right on'];
  function praiseFor(q) { return PRAISE[Engine.seedFrom(q.qid || q.prompt || 'x') % PRAISE.length]; }

  function questionView(q, opts) {
    opts = opts || {};
    const maxAttempts = opts.maxAttempts || Infinity;
    const allowReveal = opts.allowReveal !== false;
    let attempts = 0;
    let resolved = false;

    const root = el('div', { class: 'col', style: 'gap:12px' });
    const feedbackSlot = el('div', { 'aria-live': 'polite' });
    const controls = el('div', { class: 'col', style: 'gap:10px' });

    function resolve(correct, revealed) {
      if (resolved) return;
      resolved = true;
      if (opts.onResolved) opts.onResolved({ correct, firstTry: correct && attempts === 1, revealed: !!revealed, attempts });
    }

    function showFeedback(kind, head, body) {
      feedbackSlot.replaceChildren(
        el('div', { class: 'feedback ' + kind },
          el('div', { class: 'fb-head' }, head),
          el('div', { html: fmt(body || '') })));
      feedbackSlot.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function wrongFlow(customMsg) {
      attempts += 1;
      Sfx.wrong();
      if (opts.onWrongAttempt) opts.onWrongAttempt();
      if (attempts >= maxAttempts) {
        showFeedback('bad', 'Not this time', (customMsg ? customMsg + ' ' : '') + (q.explain ? 'Here\'s the idea: ' + q.explain : ''));
        resolve(false, false);
        return true; // exhausted
      }
      const revealBtn = (allowReveal && attempts >= 2)
        ? el('button', { class: 'btn sm ghost', style: 'margin-top:10px', onclick: reveal }, 'Reveal answer (no XP)')
        : null;
      feedbackSlot.replaceChildren(
        el('div', { class: 'feedback bad' },
          el('div', { class: 'fb-head' }, 'Not quite — try again'),
          el('div', { html: fmt(customMsg || 'Take another look. Wrong answers here cost nothing but XP — this is the practice room, not the gig.') }),
          revealBtn));
      return false;
    }

    let reveal = () => {};

    /* ---------- MCQ / PREDICT / COMPILER ---------- */
    if (q.type === 'mcq' || q.type === 'predict' || q.type === 'compiler') {
      let chosen = -1;
      const optBtns = [];
      if (q.type === 'predict' && q.code) root.appendChild(UI.codePanel(q.code, 'predict the result'));
      if (q.type === 'compiler') {
        if (q.code) root.appendChild(UI.codePanel(q.code, 'the code'));
        root.appendChild(UI.compilerPanel(q.error));
      } else if (q.type === 'mcq' && q.code) {
        root.appendChild(UI.codePanel(q.code, 'the code'));
      }
      root.appendChild(el('p', { style: 'font-size:15px', html: fmt(q.prompt) }));

      const opts_ = el('div', { class: 'opts', role: 'radiogroup' });
      q.options.forEach((o, i) => {
        const b = el('button', { class: 'opt', role: 'radio', 'aria-checked': 'false', onclick: () => {
          if (resolved) return;
          Sfx.tap();
          chosen = i;
          optBtns.forEach((bb, j) => {
            bb.classList.toggle('sel', j === i);
            bb.setAttribute('aria-checked', j === i ? 'true' : 'false');
          });
          checkBtn.disabled = false;
        } },
          el('span', { class: 'key' }, String.fromCharCode(65 + i)),
          el('span', { html: fmt(o.t) }));
        optBtns.push(b);
        opts_.appendChild(b);
      });
      root.appendChild(opts_);

      const checkBtn = el('button', { class: 'btn primary block', disabled: true, onclick: () => {
        if (resolved || chosen < 0) return;
        const r = Engine.evalMcq(q, chosen);
        if (r.correct) {
          Sfx.correct();
          optBtns[chosen].classList.remove('sel');
          optBtns[chosen].classList.add('right');
          optBtns.forEach((b) => { b.disabled = true; });
          attempts += 1;
          showFeedback('ok', praiseFor(q), q.explain);
          resolve(true);
        } else {
          optBtns[chosen].classList.remove('sel');
          optBtns[chosen].classList.add('wrong');
          const why = q.options[chosen].why;
          const exhausted = wrongFlow(why);
          if (exhausted) {
            optBtns.forEach((b, j) => { b.disabled = true; if (j === q.answer) b.classList.add('right'); });
          } else {
            const picked = chosen;
            setTimeout(() => optBtns[picked] && optBtns[picked].classList.remove('wrong'), 900);
            chosen = -1;
            checkBtn.disabled = true;
          }
        }
      } }, 'Check');
      controls.appendChild(checkBtn);

      reveal = () => {
        if (resolved) return;
        optBtns.forEach((b, j) => { b.disabled = true; if (j === q.answer) b.classList.add('right'); });
        showFeedback('info', 'Answer revealed', q.explain);
        resolve(false, true);
      };
    }

    /* ---------- FILL ---------- */
    else if (q.type === 'fill') {
      root.appendChild(el('p', { style: 'font-size:15px', html: fmt(q.prompt) }));
      const codeHolder = el('div');
      function renderCode(filled) {
        let html;
        if (filled !== undefined) {
          // Substitute the answer, highlight, then mark the filled region.
          const MARK = 'XTXPPSBLANKX';
          html = UI.highlightCpp(q.code.replace('___', MARK + filled + MARK));
          const seg = html.split(MARK);
          html = seg.length === 3
            ? seg[0] + '<span class="blank-mark">' + seg[1] + '</span>' + seg[2]
            : UI.highlightCpp(q.code.replace('___', filled));
        } else {
          // ___ survives highlighting as a plain identifier token.
          html = UI.highlightCpp(q.code).replace('___', '<span class="blank-mark">____</span>');
        }
        codeHolder.replaceChildren(
          el('div', { class: 'code' },
            el('div', { class: 'code-head' }, el('span', { class: 'dot' }), el('span', { class: 'dot' }), el('span', null, 'fill the blank')),
            el('pre', { html })));
      }
      renderCode();
      root.appendChild(codeHolder);

      const input = el('input', {
        class: 'blank-input', type: 'text',
        placeholder: q.placeholder || 'type the missing code',
        autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
        'aria-label': 'Your answer',
      });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doCheck(); } });
      root.appendChild(input);

      const hintSlot = el('div');
      if (q.hint) {
        controls.appendChild(el('button', { class: 'btn sm ghost', onclick: (e) => {
          hintSlot.replaceChildren(el('div', { class: 'feedback info' },
            el('div', { class: 'fb-head' }, 'Hint'),
            el('div', { html: fmt(q.hint) })));
          e.target.remove();
        } }, 'Hint'));
      }
      root.appendChild(hintSlot);

      function doCheck() {
        if (resolved) return;
        const r = Engine.evalFill(q, input.value);
        if (r.empty) { UI.toast('Type an answer first'); return; }
        if (r.correct) {
          Sfx.correct();
          attempts += 1;
          renderCode(input.value.trim());
          input.disabled = true;
          showFeedback('ok', 'Correct — Simulated check passed', q.explain);
          resolve(true);
        } else {
          wrongFlow(r.msg);
        }
      }
      controls.appendChild(el('button', { class: 'btn primary block', onclick: doCheck }, 'Check'));

      reveal = () => {
        if (resolved) return;
        renderCode(q.accept[0]);
        input.disabled = true;
        showFeedback('info', 'Answer revealed', 'The answer was `' + q.accept[0] + '`. ' + (q.explain || ''));
        resolve(false, true);
      };
    }

    /* ---------- ORDER ---------- */
    else if (q.type === 'order') {
      root.appendChild(el('p', { style: 'font-size:15px', html: fmt(q.prompt) }));
      let arrangement = Engine.shuffledOrder(q); // arrangement[pos] = original index
      const listHolder = el('div');

      function renderList(marks) {
        const list = el('div', { class: 'order-list', role: 'list' });
        arrangement.forEach((orig, pos) => {
          const row = el('div', { class: 'order-row' + (marks ? (marks.includes(pos) ? ' wrong' : ' right') : ''), role: 'listitem' },
            el('div', { class: 'order-line', html: UI.highlightCpp(q.lines[orig]) }),
            el('div', { class: 'order-ctl' },
              el('button', { 'aria-label': 'Move line up', disabled: pos === 0 || resolved, onclick: () => move(pos, -1) }, '▲'),
              el('button', { 'aria-label': 'Move line down', disabled: pos === arrangement.length - 1 || resolved, onclick: () => move(pos, 1) }, '▼')));
          list.appendChild(row);
        });
        listHolder.replaceChildren(list);
      }

      function move(pos, dir) {
        if (resolved) return;
        Sfx.tap();
        const j = pos + dir;
        [arrangement[pos], arrangement[j]] = [arrangement[j], arrangement[pos]];
        renderList();
      }

      renderList();
      root.appendChild(listHolder);

      controls.appendChild(el('button', { class: 'btn primary block', onclick: () => {
        if (resolved) return;
        const r = Engine.evalOrder(q, arrangement);
        if (r.correct) {
          Sfx.correct();
          attempts += 1;
          renderList([]);
          showFeedback('ok', 'Correct — it compiles (simulated)', q.explain);
          resolve(true);
        } else {
          const exhausted = wrongFlow(r.wrongPositions.length + (r.wrongPositions.length === 1 ? ' line is' : ' lines are') + ' in the wrong position (marked red).');
          renderList(r.wrongPositions);
          if (exhausted) {
            arrangement = q.lines.map((_, i) => i);
            renderList([]);
          }
        }
      } }, 'Check order'));

      reveal = () => {
        if (resolved) return;
        arrangement = q.lines.map((_, i) => i);
        renderList([]);
        showFeedback('info', 'Answer revealed', q.explain);
        resolve(false, true);
      };
    }

    /* ---------- BUGSPOT ---------- */
    else if (q.type === 'bugspot') {
      root.appendChild(el('p', { style: 'font-size:15px', html: fmt(q.prompt) }));
      let selected = -1;
      const lineBtns = [];
      const codeBox = el('div', { class: 'code' },
        el('div', { class: 'code-head' }, el('span', { class: 'dot' }), el('span', { class: 'dot' }), el('span', null, 'tap the buggy line')));
      q.code.forEach((line, i) => {
        const b = el('button', { class: 'codeline', onclick: () => {
          if (resolved) return;
          Sfx.tap();
          selected = i;
          lineBtns.forEach((bb, j) => bb.classList.toggle('sel', j === i));
          checkBtn.disabled = false;
        } });
        b.appendChild(el('span', { class: 'ln' }, String(i + 1)));
        const codeSpan = el('span');
        codeSpan.innerHTML = UI.highlightCpp(line || ' ');
        b.appendChild(codeSpan);
        lineBtns.push(b);
        codeBox.appendChild(b);
      });
      root.appendChild(codeBox);

      const checkBtn = el('button', { class: 'btn primary block', disabled: true, onclick: () => {
        if (resolved || selected < 0) return;
        const r = Engine.evalBugspot(q, selected);
        if (r.correct) {
          Sfx.correct();
          attempts += 1;
          lineBtns.forEach((b, j) => { b.disabled = true; b.classList.remove('sel'); if (j === q.buggy) b.classList.add('hit'); });
          showFeedback('ok', 'Bug found — nice ears', q.explain + (q.fix ? ' **Fix:** `' + q.fix + '`' : ''));
          resolve(true);
        } else {
          lineBtns[selected].classList.remove('sel');
          const wrongLine = lineBtns[selected];
          wrongLine.classList.add('hit');
          setTimeout(() => wrongLine.classList.remove('hit'), 800);
          const exhausted = wrongFlow('That line is fine, actually. Look for the line that breaks a rule you\'ve learned.');
          if (exhausted) {
            lineBtns.forEach((b, j) => { b.disabled = true; if (j === q.buggy) b.classList.add('hit'); });
          } else {
            selected = -1;
            checkBtn.disabled = true;
          }
        }
      } }, 'This is the bug');
      controls.appendChild(checkBtn);

      reveal = () => {
        if (resolved) return;
        lineBtns.forEach((b, j) => { b.disabled = true; if (j === q.buggy) b.classList.add('hit'); });
        showFeedback('info', 'Answer revealed', q.explain + (q.fix ? ' **Fix:** `' + q.fix + '`' : ''));
        resolve(false, true);
      };
    }

    /* ---------- MATCH ---------- */
    else if (q.type === 'match') {
      root.appendChild(el('p', { style: 'font-size:15px', html: fmt(q.prompt) }));
      root.appendChild(el('p', { class: 'small faint' }, 'Tap a left item, then its partner on the right. Tap a paired item to unpair.'));
      const rightOrder = Engine.shuffledMatch(q); // display order of right items
      const pairs = new Array(q.left.length).fill(-1); // leftIdx -> rightOriginalIdx
      let activeLeft = -1;
      const leftBtns = [], rightBtns = [];

      const grid = el('div', { class: 'match-grid' });
      const maxRows = Math.max(q.left.length, rightOrder.length);
      for (let r = 0; r < maxRows; r++) {
        // left cell
        if (r < q.left.length) {
          const li = r;
          const b = el('button', { class: 'match-item code', onclick: () => {
            if (resolved) return;
            Sfx.tap();
            if (pairs[li] !== -1) { pairs[li] = -1; refresh(); return; }
            activeLeft = (activeLeft === li) ? -1 : li;
            refresh();
          } }, q.left[li]);
          leftBtns.push(b);
          grid.appendChild(b);
        } else grid.appendChild(el('div'));
        // right cell
        if (r < rightOrder.length) {
          const ri = rightOrder[r];
          const b = el('button', { class: 'match-item', onclick: () => {
            if (resolved) return;
            Sfx.tap();
            const pairedLeft = pairs.indexOf(ri);
            if (pairedLeft !== -1) { pairs[pairedLeft] = -1; refresh(); return; }
            if (activeLeft !== -1) { pairs[activeLeft] = ri; activeLeft = -1; refresh(); }
          } }, q.right[ri]);
          rightBtns.push({ b, ri });
          grid.appendChild(b);
        } else grid.appendChild(el('div'));
      }

      function refresh(marks) {
        leftBtns.forEach((b, li) => {
          b.classList.toggle('sel', activeLeft === li);
          b.classList.toggle('paired', pairs[li] !== -1);
          b.classList.toggle('wrongpair', !!(marks && marks.includes(li)));
        });
        rightBtns.forEach(({ b, ri }) => {
          const li = pairs.indexOf(ri);
          b.classList.toggle('paired', li !== -1);
          b.classList.toggle('wrongpair', !!(marks && li !== -1 && marks.includes(li)));
        });
        checkBtn.disabled = pairs.some((p) => p === -1);
      }

      root.appendChild(grid);
      const checkBtn = el('button', { class: 'btn primary block', disabled: true, onclick: () => {
        if (resolved) return;
        const r = Engine.evalMatch(q, pairs);
        if (r.correct) {
          Sfx.correct();
          attempts += 1;
          refresh();
          leftBtns.forEach((b) => { b.disabled = true; });
          rightBtns.forEach(({ b }) => { b.disabled = true; });
          showFeedback('ok', 'All connected — clean patch', q.explain);
          resolve(true);
        } else {
          const exhausted = wrongFlow(r.wrongLeft.length + (r.wrongLeft.length === 1 ? ' pair is' : ' pairs are') + ' mismatched (marked red). Unpair and rewire them.');
          refresh(r.wrongLeft);
          if (exhausted) {
            for (let i = 0; i < pairs.length; i++) pairs[i] = i;
            refresh();
            leftBtns.forEach((b) => { b.disabled = true; });
            rightBtns.forEach(({ b }) => { b.disabled = true; });
          }
        }
      } }, 'Check connections');
      controls.appendChild(checkBtn);
      refresh();

      reveal = () => {
        if (resolved) return;
        for (let i = 0; i < pairs.length; i++) pairs[i] = i;
        refresh();
        leftBtns.forEach((b) => { b.disabled = true; });
        rightBtns.forEach(({ b }) => { b.disabled = true; });
        showFeedback('info', 'Answer revealed', q.explain);
        resolve(false, true);
      };
    }

    root.appendChild(feedbackSlot);
    root.appendChild(controls);
    return root;
  }

  /* =====================================================================
     SEQUENCE RUNNER — plays a list of questions with XP accounting.
     Used by lessons (checks), challenges, projects, boss and practice.
     cfg: { title, eyebrow, questions:[{q, note?}], baseXp, nodeId,
            bossMode?, onFinish({correct, firstTry, earned}) , stepStart?,
            onStep? }
     ===================================================================== */
  function sequenceRunner(cfg) {
    const wrap = el('div', { class: 'col', style: 'gap:14px' });
    const n = cfg.questions.length;
    const share = cfg.baseXp / n;
    let idx = cfg.stepStart || 0;
    let firstTryCount = 0;
    let correctCount = 0;
    let earned = 0;
    const stageResults = [];

    const track = el('div', { class: 'stage-track', 'aria-hidden': 'true' });
    const trackCells = [];
    for (let i = 0; i < n; i++) {
      const c = el('i', { class: i < idx ? 'done' : (i === idx ? 'now' : '') });
      trackCells.push(c);
      track.appendChild(c);
    }
    wrap.appendChild(el('div', { class: 'col gap-s' },
      el('span', { class: 'eyebrow phos' }, cfg.eyebrow || ''),
      track));

    const slot = el('div');
    wrap.appendChild(slot);

    function renderStep() {
      const item = cfg.questions[idx];
      trackCells.forEach((c, i) => { c.className = stageResults[i] === false ? 'fail' : (i < idx ? 'done' : (i === idx ? 'now' : '')); });

      const stepBits = el('div', { class: 'col', style: 'gap:12px' });
      stepBits.appendChild(el('div', { class: 'row between' },
        el('span', { class: 'mono small dim' }, 'STEP ' + (idx + 1) + ' / ' + n),
        el('span', { class: 'mono small faint' }, conceptLabel(item.q.concept) || '')));
      if (item.note) stepBits.appendChild(el('div', { class: 'callout warn' },
        el('div', { class: 'co-head' }, 'Briefing'),
        el('div', { html: fmt(item.note) })));

      const qv = questionView(item.q, {
        maxAttempts: cfg.bossMode ? 2 : Infinity,
        allowReveal: !cfg.bossMode,
        onWrongAttempt: () => {
          if (item.q.qid) Store.markWeak(item.q.qid, cfg.nodeId || '', item.q.concept);
        },
        onResolved: (res) => {
          stageResults[idx] = res.correct;
          if (cfg.onQuestionResolved) cfg.onQuestionResolved(item, res);
          if (res.correct) {
            correctCount += 1;
            if (res.firstTry) firstTryCount += 1;
            earned += share > 0 ? (res.firstTry ? share : share / 2) : 0;
          }
          trackCells[idx].className = res.correct ? 'done' : 'fail';
          const isLast = idx === n - 1;
          stepBits.appendChild(el('div', { class: 'action-bar' },
            el('button', { class: 'btn primary block', onclick: () => {
              idx += 1;
              if (cfg.onStep) cfg.onStep(idx);
              if (idx >= n) {
                cfg.onFinish({ correct: correctCount, firstTry: firstTryCount, earned: Math.round(earned), total: n });
              } else {
                renderStep();
              }
            } }, isLast ? 'Finish' : 'Continue')));
        },
      });
      stepBits.appendChild(qv);
      slot.replaceChildren(stepBits);
      wrap.scrollIntoView({ block: 'start' });
      window.scrollTo({ top: 0 });
    }

    renderStep();
    return wrap;
  }

      el('div', { class: 'h-sub mt-s' }, daily.done ? 'Back tomorrow with a fresh one.' : 'One question. +40 XP. Keeps the streak alive.')));

        el('span', { class: 'dim small' }, (st.streak.count === 1 ? 'day' : 'days') + (st.streak.last === Store.todayStr() ? ' — active today' : ''))),

        el('div', { class: 'small' }, 'This browser is blocking local storage, so progress lasts only for this visit. Use Settings → Export to save your progress as JSON.')));
    }
    return main;
  }

  function nodeKindLabel(node) {
    if (node.kind === 'lesson') return 'Lesson · ' + node.short;
    if (node.kind === 'project') return 'Mini-project mission';
    if (node.kind === 'boss') return 'Boss challenge';
    const map = { completion: 'Code completion', bugfix: 'Bug hunt', ordering: 'Code ordering', compiler: 'Compiler challenge' };
    return 'Challenge · ' + (map[node.ctype] || 'Challenge');
  }

  function nodeIcoText(node) {
    if (node.kind === 'lesson') return '§';
    if (node.kind === 'project') return '◆';
    if (node.kind === 'boss') return '☠';
    const map = { completion: '{}', bugfix: '✗', ordering: '≡', compiler: '⚠' };
    return map[node.ctype] || '?';
  }

    'classes': 'classes', 'encapsulation': 'encapsulation', 'headers': 'headers',
    'compiler-errors': 'compiler errors', 'realtime-safety': 'real-time safety',
  };
  function conceptLabel(c) { return CONCEPT_LABELS[c] || c; }
