<title>TXPPS VST CODE LAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>/* ============================================================
   TXPPS VST CODE LAB — studio-at-night design system
   Committed single-theme dark interface (deliberate choice:
   the whole product is a night-session studio rack).
   ============================================================ */
:root {
  --bg0: #0A0C0F;      /* studio black — page ground */
  --bg1: #12151A;      /* rack panel charcoal */
  --bg2: #181D24;      /* raised module surface */
  --bg3: #20262F;      /* highest surface / pressed */
  --line: #2A313B;     /* panel seams */
  --line-soft: #20252d;
  --ink: #EAE4D4;      /* warm cream */
  --ink-dim: #A29D8F;  /* warm gray */
  --ink-faint: #857F6E;
  --phos: #5DE894;     /* phosphor green — instrument light */
  --phos-dim: #2E8757;
  --phos-glow: rgba(93, 232, 148, 0.13);
  --amber: #F0B450;    /* warning / streak / locks */
  --amber-glow: rgba(240, 180, 80, 0.12);
  --red: #F07862;      /* clip LED — errors */
  --red-glow: rgba(240, 120, 98, 0.12);
  --code-kw: #F0B450;
  --code-num: #5DE894;
  --code-str: #D8B48A;
  --code-com: #6E6A5F;
  --code-pre: #8FB8D8;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --rad: 10px;
  --rad-sm: 6px;
  --tap: 44px;
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg0);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
  min-height: 100vh;
}
/* faint scanline texture over the whole surface */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
  z-index: 0;
}

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--phos);
  outline-offset: 2px;
}
input, textarea, select { font-family: inherit; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.25; }
::selection { background: var(--phos-dim); color: var(--ink); }

.app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; min-height: 100vh; }

/* ---------- top rack strip ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px calc(10px);
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: linear-gradient(180deg, var(--bg1), rgba(18,21,26,0.92));
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
  color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.brand b { color: var(--phos); font-weight: 700; }
.brand .led {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--phos); box-shadow: 0 0 6px var(--phos);
  flex: none;
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.xp-chip {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
  color: var(--ink-dim); display: flex; align-items: center; gap: 7px;
}
.xp-chip .lvl { color: var(--phos); font-weight: 700; }
.vu { width: 64px; height: 8px; background: var(--bg0); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.vu > i { display: block; height: 100%; background: linear-gradient(90deg, var(--phos-dim), var(--phos)); transition: width 0.5s ease; }
.streak-chip { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: 0.04em; white-space: nowrap; }
.icon-btn {
  min-width: var(--tap); min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--rad-sm); color: var(--ink-dim);
}
.icon-btn:active { background: var(--bg3); }

/* ---------- main scroll area ---------- */
.main {
  padding: 16px 14px calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  animation: viewin 0.22s ease;
}
@keyframes viewin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  animation-duration: 0.01ms !important; transition-duration: 0.01ms !important;
}

/* ---------- bottom transport tab bar ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  display: flex; justify-content: center;
  background: linear-gradient(0deg, var(--bg1), rgba(18,21,26,0.94));
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { display: flex; width: 100%; max-width: 760px; }
.tab {
  flex: 1; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  color: var(--ink-faint);
  border-top: 2px solid transparent;
}
.tab svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.tab.on { color: var(--phos); border-top-color: var(--phos); }
.tab:active { background: var(--bg2); }

/* ---------- cards & modules ---------- */
.card {
  background: var(--bg1);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 16px;
}
.card.raised { background: var(--bg2); }
.card-tap { display: block; width: 100%; text-align: left; transition: border-color 0.15s; }
.card-tap:active { background: var(--bg2); border-color: var(--phos-dim); }
.eyebrow {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-faint);
  display: flex; align-items: center; gap: 8px;
}
.eyebrow.phos { color: var(--phos); }
.eyebrow.amber { color: var(--amber); }
.eyebrow.red { color: var(--red); }
.h-display {
  font-family: var(--mono); letter-spacing: 0.04em;
  font-size: 19px; font-weight: 700;
}
.h-sub { font-size: 14px; color: var(--ink-dim); }
.divider-wave { height: 18px; opacity: 0.5; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px;
  font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: var(--rad-sm);
  border: 1px solid var(--line);
  background: var(--bg2); color: var(--ink);
  transition: transform 0.06s, background 0.15s;
  touch-action: manipulation;
}
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: linear-gradient(180deg, #1d3a2a, #16281f);
  border-color: var(--phos-dim);
  color: var(--phos);
  box-shadow: 0 0 0 1px rgba(93,232,148,0.08), 0 4px 14px rgba(0,0,0,0.4);
}
.btn.primary:active { background: #16281f; }
.btn.amber { border-color: var(--amber); color: var(--amber); background: rgba(240,180,80,0.06); }
.btn.danger { border-color: var(--red); color: var(--red); background: rgba(240,120,98,0.06); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 11.5px; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }

/* ---------- code panel ---------- */
.code {
  background: #0B0E12;
  border: 1px solid var(--line);
  border-radius: var(--rad-sm);
  overflow: hidden;
}
.code-head {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
  color: var(--ink-faint); text-transform: uppercase;
}
.code-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.code pre {
  margin: 0; padding: 12px 12px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: var(--code-fs, 13px);
  line-height: 1.62;
  color: var(--ink);
  -webkit-overflow-scrolling: touch;
  tab-size: 4;
}
.code-s .code pre, .code-s.code pre { --code-fs: 12px; }
.code-l .code pre, .code-l.code pre { --code-fs: 14.5px; }
.tok-kw { color: var(--code-kw); }
.tok-num { color: var(--code-num); }
.tok-str { color: var(--code-str); }
.tok-com { color: var(--code-com); font-style: italic; }
.tok-pre { color: var(--code-pre); }
.tok-fn { color: var(--ink); font-weight: 600; }

/* tappable code lines (bug hunt) */
.codeline {
  display: block; width: 100%; text-align: left;
  font-family: var(--mono); font-size: var(--code-fs, 13px); line-height: 1.5;
  padding: 7px 10px 7px 8px;
  border: none; border-left: 3px solid transparent;
  color: var(--ink); white-space: pre; overflow-x: auto; max-width: 100%;
}
.codeline .ln { color: var(--ink-faint); display: inline-block; width: 2em; user-select: none; }
.codeline.sel { background: var(--phos-glow); border-left-color: var(--phos); }
.codeline.hit { background: var(--red-glow); border-left-color: var(--red); }
.codeline.good { background: var(--phos-glow); border-left-color: var(--phos); }
.codeline:focus-visible { outline-offset: -2px; }

/* inline blank in fill challenges */
.blank-input {
  width: 100%;
  background: #0B0E12;
  border: 1px solid var(--phos-dim);
  border-radius: var(--rad-sm);
  color: var(--phos);
  font-family: var(--mono); font-size: 16px; /* >=16px stops iOS focus zoom */
  padding: 12px;
  min-height: var(--tap);
}
.blank-input::placeholder { color: var(--ink-faint); }
.blank-mark { color: var(--phos); background: var(--phos-glow); border-radius: 3px; padding: 0 4px; }

/* ---------- simulated compiler panel ---------- */
.compiler {
  background: #100D08;
  border: 1px solid var(--amber);
  border-radius: var(--rad-sm);
  overflow: hidden;
}
.compiler-head {
  padding: 6px 10px;
  background: var(--amber-glow);
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
  color: var(--amber); text-transform: uppercase;
  display: flex; align-items: center; gap: 7px;
}
.compiler pre {
  margin: 0; padding: 12px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.6;
  color: var(--amber);
  -webkit-overflow-scrolling: touch;
}
.compiler pre .err { color: var(--red); font-weight: 700; }

/* ---------- MCQ options ---------- */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 11px;
  width: 100%; text-align: left;
  min-height: var(--tap);
  padding: 13px 14px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--rad-sm);
  font-size: 14.5px; line-height: 1.45;
  transition: border-color 0.12s, background 0.12s;
}
.opt .key {
  flex: none; width: 24px; height: 24px; margin-top: 1px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 5px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
}
.opt code { font-family: var(--mono); font-size: 0.92em; color: var(--phos); background: rgba(93,232,148,0.07); padding: 1px 4px; border-radius: 3px; }
.opt.sel { border-color: var(--phos); background: var(--phos-glow); }
.opt.sel .key { border-color: var(--phos); color: var(--phos); }
.opt.right { border-color: var(--phos); background: var(--phos-glow); }
.opt.right .key { border-color: var(--phos); color: var(--phos); }
.opt.wrong { border-color: var(--red); background: var(--red-glow); }
.opt.wrong .key { border-color: var(--red); color: var(--red); }
.opt:disabled { cursor: default; opacity: 1; }
.opt.faded { opacity: 0.45; }

/* ---------- ordering ---------- */
.order-list { display: flex; flex-direction: column; gap: 8px; }
.order-row {
  display: flex; align-items: stretch; gap: 8px;
}
.order-line {
  flex: 1; display: flex; align-items: center;
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--rad-sm);
  padding: 10px 12px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.4;
  overflow-x: auto; white-space: pre;
  -webkit-overflow-scrolling: touch;
}
.order-row.right .order-line { border-color: var(--phos); background: var(--phos-glow); }
.order-row.wrong .order-line { border-color: var(--red); background: var(--red-glow); }
.order-ctl { display: flex; flex-direction: column; gap: 4px; }
.order-ctl button {
  width: 44px; flex: 1; min-height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3); border: 1px solid var(--line); border-radius: 5px;
  color: var(--ink-dim); font-size: 13px;
}
.order-ctl button:active { color: var(--phos); border-color: var(--phos-dim); }
.order-ctl button:disabled { opacity: 0.3; }

/* ---------- match pairs ---------- */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match-item {
  min-height: var(--tap);
  padding: 10px 11px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--rad-sm);
  font-size: 13px; line-height: 1.35; text-align: left;
  display: flex; align-items: center;
}
.match-item.code { font-family: var(--mono); font-size: 12px; color: var(--phos); }
.match-item.sel { border-color: var(--amber); background: var(--amber-glow); }
.match-item.paired { border-color: var(--phos-dim); background: var(--phos-glow); opacity: 0.85; }
.match-item.wrongpair { border-color: var(--red); background: var(--red-glow); }

/* ---------- feedback panel ---------- */
.feedback {
  border-radius: var(--rad-sm);
  padding: 13px 14px;
  font-size: 14px; line-height: 1.5;
  border: 1px solid;
  animation: viewin 0.18s ease;
}
.feedback.ok { border-color: var(--phos-dim); background: var(--phos-glow); }
.feedback.bad { border-color: var(--red); background: var(--red-glow); }
.feedback.info { border-color: var(--amber); background: var(--amber-glow); }
.feedback .fb-head {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 6px; display: flex; align-items: center; gap: 7px;
}
.feedback.ok .fb-head { color: var(--phos); }
.feedback.bad .fb-head { color: var(--red); }
.feedback.info .fb-head { color: var(--amber); }
.feedback code { font-family: var(--mono); font-size: 0.9em; color: var(--phos); background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; }

/* ---------- lesson content ---------- */
.prose { font-size: 15px; line-height: 1.62; max-width: 62ch; }
.prose strong { color: var(--ink); }
.prose code { font-family: var(--mono); font-size: 0.9em; color: var(--phos); background: rgba(93,232,148,0.08); padding: 1px 5px; border-radius: 3px; }
.callout {
  border-left: 3px solid var(--phos); border-radius: 0 var(--rad-sm) var(--rad-sm) 0;
  background: var(--bg2); padding: 11px 13px; font-size: 14px; line-height: 1.55;
}
.callout.analogy { border-left-color: var(--phos); }
.callout.mistake { border-left-color: var(--red); }
.callout.warn { border-left-color: var(--amber); }
.callout .co-head {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 5px;
}
.callout.analogy .co-head { color: var(--phos); }
.callout.mistake .co-head { color: var(--red); }
.callout.warn .co-head { color: var(--amber); }

/* lesson hook — the familiar studio situation */
.hook {
  font-size: 16.5px; line-height: 1.55; color: var(--ink);
  border-left: 3px solid var(--phos);
  padding: 4px 2px 4px 14px;
}

/* diagram wrapper */
.viz-wrap {
  background: #07090B;
  border: 1px solid var(--line);
  border-radius: var(--rad-sm);
  padding: 10px 8px 6px;
}
.viz-wrap svg { display: block; width: 100%; height: auto; }
.viz-cap {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-faint);
  padding: 6px 4px 2px;
}

/* piece-by-piece code breakdown (sits under a code panel) */
.breakdown {
  border: 1px solid var(--line-soft);
  border-radius: var(--rad-sm);
  background: #0B0E12;
  padding: 10px 12px;
  margin-top: -6px;
  display: flex; flex-direction: column; gap: 7px;
}
.bd-head {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.16em;
  color: var(--ink-faint);
}
.bd-row { display: flex; gap: 10px; align-items: baseline; font-size: 13px; line-height: 1.4; }
.bd-code {
  font-family: var(--mono); font-size: 11.5px; color: var(--phos);
  flex: none; width: 118px; overflow-wrap: break-word;
}
.bd-what { color: var(--ink-dim); }

/* end-of-lesson panels */
.callout.remember {
  border-left-color: var(--phos);
  background: linear-gradient(90deg, rgba(93,232,148,0.09), var(--bg2));
}
.callout.remember .co-head { color: var(--phos); }
.callout.remember .co-body { font-size: 15.5px; color: var(--ink); line-height: 1.5; }
.plugin-use { display: flex; gap: 10px; align-items: baseline; }
.pu-name {
  flex: none; width: 92px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--phos);
}
.pu-desc { font-size: 13.5px; color: var(--ink-dim); line-height: 1.45; }

/* progress dots inside lesson */
.dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dots i {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--line);
}
.dots i.done { background: var(--phos); border-color: var(--phos); }
.dots i.now { border-color: var(--phos); box-shadow: 0 0 5px var(--phos-glow); background: var(--bg1); }

/* ---------- map ---------- */
.zone-rack {
  border: 1px solid var(--line); border-radius: var(--rad);
  background: var(--bg1); overflow: hidden;
}
.zone-head {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 15px;
}
.zone-num {
  flex: none; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--phos-dim); border-radius: 7px;
  font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--phos);
}
.zone-rack.locked .zone-num { border-color: var(--line); color: var(--ink-faint); }
.zone-title { font-family: var(--mono); font-size: 13.5px; font-weight: 700; letter-spacing: 0.06em; }
.zone-tag { font-size: 12.5px; color: var(--ink-dim); }
.zone-meta { margin-left: auto; text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); flex: none; }
.node-list { border-top: 1px solid var(--line-soft); }
.node-row {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 15px; min-height: 56px;
  border-bottom: 1px solid var(--line-soft);
}
.node-row:last-child { border-bottom: none; }
.node-row:active { background: var(--bg2); }
.node-row.locked { opacity: 0.5; }
.node-ico {
  flex: none; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px; border: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; color: var(--ink-dim);
}
.node-ico.lesson { color: var(--phos); border-color: var(--phos-dim); }
.node-ico.challenge { color: var(--amber); border-color: var(--amber); }
.node-ico.project { color: var(--code-pre); border-color: var(--code-pre); }
.node-ico.boss { color: var(--red); border-color: var(--red); }
.node-name { font-size: 14px; line-height: 1.3; }
.node-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.node-right { margin-left: auto; flex: none; display: flex; align-items: center; gap: 8px; }

.stars { font-size: 12px; letter-spacing: 2px; color: var(--amber); font-family: var(--mono); white-space: nowrap; }
.stars .off { color: var(--bg3); -webkit-text-stroke: 0.5px var(--line); }

/* ---------- meters / stats ---------- */
.meter { height: 10px; background: var(--bg0); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--phos-dim), var(--phos)); transition: width 0.5s ease; }
.meter.amber > i { background: linear-gradient(90deg, #8a6526, var(--amber)); }

/* ===== src/js/data_glossary.js ===== */
/* ============================================================
   Glossary — C++, DSP, JUCE and tooling terms.
   Shape: { t: term, c: category, d: definition, a?: audio analogy }
   Categories: 'C++', 'DSP', 'JUCE', 'TOOLS'
   ============================================================ */

const GLOSSARY = [
  { t: 'variable', c: 'C++', d: 'A named slot that stores one value of a fixed type.', a: 'A labeled knob position — one name, one current value.' },
  { t: 'type', c: 'C++', d: 'The kind of value a variable holds (float, int, bool…). Set at declaration, never changes.', a: 'The kind of jack: audio, MIDI, or footswitch. No cross-plugging.' },
  { t: 'float', c: 'C++', d: '32-bit floating-point number. The standard type for audio samples, normally in the -1.0 to +1.0 range. Literals take an f suffix: 0.5f.' },
  { t: 'double', c: 'C++', d: '64-bit floating-point number — twice the precision of float. Used for phase accumulators and other precision-critical math.' },
  { t: 'int', c: 'C++', d: 'Whole-number type. Used for counters, indexes, and MIDI data (notes 0–127). int / int truncates the remainder.' },
  { t: 'bool', c: 'C++', d: 'true or false. The type for bypass switches and flags.' },
  { t: 'const', c: 'C++', d: 'Marks a value read-only. Any code that tries to modify it fails to compile.', a: 'The locked sample rate of a running session — nobody changes it mid-take.' },
  { t: 'constexpr', c: 'C++', d: 'Like const, but the value is computed and fixed at compile time.' },
  { t: 'function', c: 'C++', d: 'A named, reusable block of code with typed inputs (parameters) and one typed output (return value).', a: 'A pedal: signal and knob settings in, processed signal out.' },
  { t: 'parameter', c: 'C++', d: 'A typed input a function receives. The caller\'s values (arguments) are copied — or referenced — into the parameters.' },
  { t: 'return value', c: 'C++', d: 'The single value a function sends back to its caller. Type void means nothing is returned.' },
  { t: 'scope', c: 'C++', d: 'The region of code where a name is valid — usually the braces it was declared in. Locals die at the closing brace.' },
  { t: 'if / else', c: 'C++', d: 'Runs code only when a condition is true, with optional alternatives. Exactly one branch of a chain executes.', a: 'A noise gate: above threshold, open; otherwise, closed.' },
  { t: 'switch', c: 'C++', d: 'Branches on one integer-like value with fixed cases. Each case needs break, or execution falls through to the next.', a: 'A rotary mode selector — discrete positions, each wired to a circuit.' },
  { t: 'loop', c: 'C++', d: 'Repeats a block of code. for = known count; while = open-ended. The block loop for(i = 0; i < numSamples; ++i) is the heart of DSP code.' },
  { t: 'array', c: 'C++', d: 'A fixed-length row of same-typed values, indexed from 0. No bounds checking — stay inside 0…size-1.' },
  { t: 'std::vector', c: 'C++', d: 'A resizable array that knows its size. resize() in setup code; never grow it inside the audio callback (it may allocate).', a: 'A delay line whose length you set while the session is stopped.' },
  { t: 'reference', c: 'C++', d: 'An alias — a second name for an existing value (float&). No copy; writes through it change the original. Must be initialized, can\'t be re-seated.', a: 'A patchbay mult: the same signal at two jack labels.' },
  { t: 'pointer', c: 'C++', d: 'A variable holding a memory address (float*). * dereferences (follows) it; & takes an address. Can be nullptr — check before dereferencing.', a: 'A written-down patch location: "delay at rack 2, slot 5".' },
  { t: 'nullptr', c: 'C++', d: 'The pointer value meaning "points at nothing". Dereferencing it is undefined behavior — typically a crash.', a: 'A note that says "nothing patched here". Don\'t plug into it.' },
  { t: 'dangling pointer', c: 'C++', d: 'A pointer to memory that has been destroyed — like the address of a local variable after its function returned. Using it is undefined behavior.' },
  { t: 'undefined behavior', c: 'C++', d: 'Code the C++ standard makes no promises about (out-of-bounds reads, null dereference, data races). May appear to work, then crash elsewhere. UB is never acceptable.' },
  { t: 'class', c: 'C++', d: 'A user-defined type bundling data (members) with functions that operate on it.', a: 'A synth schematic — the design every unit is built from.' },
  { t: 'object', c: 'C++', d: 'One instance created from a class, with its own copy of all member variables.', a: 'One physical unit on your desk. Two units, two independent sets of knobs.' },
  { t: 'constructor', c: 'C++', d: 'The function that runs automatically when an object is created, ensuring it starts in a valid state. Same name as the class, no return type.', a: 'A hardware power-on sequence: defaults loaded, unit ready.' },
  { t: 'member initializer list', c: 'C++', d: 'The : member(value) list after a constructor\'s parameters — initializes members directly, before the body runs. Preferred over assigning in the body.' },
  { t: 'encapsulation', c: 'C++', d: 'Keeping state private and exposing controlled public functions, so invalid states become impossible from outside.', a: 'Panel controls hide the circuitry — users turn knobs, they don\'t resolder.' },
  { t: 'public / private', c: 'C++', d: 'Access specifiers. public members are usable from outside code; private members only from the class\'s own functions.' },
  { t: 'header file (.h)', c: 'C++', d: 'Declares a class\'s interface for other files to #include. Starts with #pragma once.', a: 'The front-panel silkscreen: every jack labeled, case closed.' },
  { t: 'implementation file (.cpp)', c: 'C++', d: 'Defines the function bodies declared in the header, using the ClassName:: prefix.' },
  { t: '#include', c: 'C++', d: 'Pastes another file\'s contents in at compile time. Quotes ("MyClass.h") for your headers; angle brackets (<vector>) for system/library ones.' },
  { t: '#pragma once', c: 'C++', d: 'Header guard: ensures a header is included at most once per compiled file, preventing duplicate-definition errors.' },
  { t: 'compiler error', c: 'C++', d: 'A per-file build failure: syntax, types, unknown names. Points at file and line — though often one line after the real cause. Fix the first error first.' },
  { t: 'linker error', c: 'C++', d: '"undefined reference": a function was declared but no compiled body exists — never written, or its .cpp isn\'t in the build.' },
  { t: 'stack / heap', c: 'C++', d: 'Stack: fast, automatic memory for locals, freed at scope end. Heap: manually managed memory (new, vector growth) with unpredictable allocation time — which is why the audio thread avoids it.' },
  { t: 'allocation', c: 'C++', d: 'Requesting heap memory at runtime. Unbounded worst-case time; forbidden inside the audio callback. Allocate in prepareToPlay instead.' },

  { t: 'sample', c: 'DSP', d: 'One measurement of a waveform\'s amplitude at one instant — in code, one float, usually within -1.0…+1.0.' },
  { t: 'sample rate', c: 'DSP', d: 'Samples per second (44100, 48000…). Converts between time and sample counts: one second at 48 kHz is 48000 samples.' },
  { t: 'buffer / block', c: 'DSP', d: 'The chunk of samples a host delivers per callback (32–2048 samples). Smaller = lower latency, more CPU overhead.' },
  { t: 'gain', c: 'DSP', d: 'A multiplier applied to a signal. 1.0 = unity, 0.5 ≈ -6 dB, 2.0 ≈ +6 dB. Applied by multiplication, never addition.' },
  { t: 'decibel (dB)', c: 'DSP', d: 'Logarithmic level scale matching how we hear. Amplitude: gain = 10^(dB/20). 0 dB = unity; -6 dB ≈ half amplitude.' },
  { t: 'phase', c: 'DSP', d: 'Position within a waveform\'s cycle, 0 to 2π radians. An oscillator advances phase by 2π·f/fs per sample and wraps it past 2π.' },
  { t: 'DC offset', c: 'DSP', d: 'A constant added to a signal, shifting the waveform off center — wastes headroom and thumps on start/stop. One reason gain multiplies instead of adds.' },
  { t: 'audio callback', c: 'DSP', d: 'The function the host calls repeatedly with each new block, on a high-priority thread with a hard deadline. Miss the deadline and the audio glitches.', a: 'The DAW asking, every few milliseconds without fail: "next block, now."' },

/* ===== src/js/engine.js ===== */
/* ============================================================
   Challenge engine — pure logic, no DOM.
   Builds the question index and evaluates answers deterministically.
   All "compiler" feedback in this app is simulated and labeled so.
   ============================================================ */

const Engine = (() => {

  /* ---- content index ------------------------------------------------ */
  // NODES: id -> node object (lesson/challenge/project/boss)
  // QINDEX: qid -> { q, nodeId, ctx } for practice/daily reuse
  const NODES = {};
  const QINDEX = {};

  function indexAll() {
    const all = [...ZONE1_LESSONS, ...ZONE1_CHALLENGES];
    for (const node of all) {
      NODES[node.id] = node;
      const qs = questionsOf(node);
      qs.forEach((q, i) => {
        const qid = node.id + '.q' + (i + 1);
        q.qid = qid;
        QINDEX[qid] = { q, nodeId: node.id };
      });
    }
  }

  function questionsOf(node) {
    if (node.kind === 'lesson') return node.checks;
    if (node.kind === 'challenge') return node.questions;
    if (node.kind === 'project') return node.steps.map((s) => s.q);
    if (node.kind === 'boss') return node.stages;
    return [];
  }

  /* ---- deterministic shuffle (stable per qid) ------------------------ */
  function seedFrom(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function seededShuffle(arr, seedStr) {
    const a = arr.slice();
    let s = seedFrom(seedStr) || 1;
    const rnd = () => {
      // xorshift32
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Shuffled order for an `order` question; guaranteed != correct order.
  function shuffledOrder(q) {
    const idx = q.lines.map((_, i) => i);
    let out = seededShuffle(idx, q.qid || q.prompt);
    if (out.every((v, i) => v === i)) out = seededShuffle(idx, (q.qid || q.prompt) + 'x');
    if (out.every((v, i) => v === i)) out.reverse();
    return out;
  }

  // Shuffled right-column order for a `match` question.
  function shuffledMatch(q) {
    const idx = q.right.map((_, i) => i);
    let out = seededShuffle(idx, (q.qid || q.prompt) + 'm');
    if (out.every((v, i) => v === i)) out.reverse();
    return out;
  }

  /* ---- answer normalization & evaluation ----------------------------- */
  function normalize(s) {
    return String(s || '')
      .replace(/ /g, ' ')
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .trim()
      .replace(/\s+/g, ' ');
  }

  // Loose form: also drop spaces entirely and any single trailing semicolon,
  // so `output[i]=input[i]*gain` matches `output[i] = input[i] * gain;`.
  function loose(s) {
    return normalize(s).replace(/;\s*$/, '').replace(/\s+/g, '');
  }

  function evalFill(q, input) {
    const raw = normalize(input);
    if (!raw) return { correct: false, empty: true, msg: 'Type an answer first.' };

    // Known-mistake patterns get targeted feedback.
    if (q.mistakes) {
      for (const m of q.mistakes) {
        let re = null;
        try { re = new RegExp(m.match, 'i'); } catch (e) { re = null; }
        if (re && re.test(raw)) {
          // Only report as a mistake if it isn't also an accepted answer.
          const isAccepted = q.accept.some((a) => loose(a) === loose(raw));
          if (!isAccepted) return { correct: false, msg: m.msg };
        }
      }
    }
    if (q.forbidden && q.forbidden.some((f) => raw.includes(f))) {
      return { correct: false, msg: 'Not quite — check the hint and look again at the bounds.' };
    }
    const ok = q.accept.some((a) => loose(a) === loose(raw));
    return { correct: ok, msg: ok ? q.explain : null };
  }

  function evalMcq(q, chosenIndex) {
    return { correct: chosenIndex === q.answer };
  }

  function evalOrder(q, arrangement) {
    // arrangement: array of original line indexes, top to bottom.
    const wrong = [];
    arrangement.forEach((orig, pos) => { if (orig !== pos) wrong.push(pos); });
    return { correct: wrong.length === 0, wrongPositions: wrong };
  }

  function evalBugspot(q, lineIndex) {
    return { correct: lineIndex === q.buggy };
  }

  function evalMatch(q, pairs) {
    // pairs: array where pairs[leftIndex] = rightIndex chosen.
    const wrong = [];
    q.left.forEach((_, li) => { if (pairs[li] !== li) wrong.push(li); });
    return { correct: wrong.length === 0, wrongLeft: wrong };
  }

  /* ---- daily challenge ----------------------------------------------- */
  function dailyQid(dateStr) {
    const pool = DAILY_POOL.filter((qid) => QINDEX[qid]);
    if (pool.length === 0) return null;
    return pool[seedFrom(dateStr) % pool.length];
  }

  /* ---- zone helpers --------------------------------------------------- */
  function zoneNodes(zoneId) {
    const z = ZONES.find((z2) => z2.id === zoneId);
    if (!z || !z.nodeOrder) return [];
    return z.nodeOrder.map((id) => NODES[id]).filter(Boolean);
  }

  indexAll();

  return {
    NODES, QINDEX, questionsOf, zoneNodes, dailyQid,
    shuffledOrder, shuffledMatch,
    evalFill, evalMcq, evalOrder, evalBugspot, evalMatch,
    seedFrom,
  };
})();

/* ===== src/js/store.js ===== */
/* ============================================================
   Progress store — state, XP/levels/mastery/streak, persistence.
   localStorage is wrapped defensively: if unavailable (private
   browsing, sandbox), the app runs on an in-memory fallback.
   ============================================================ */

const Store = (() => {
  const KEY = 'txpps_vst_code_lab_v1';
  let memoryFallback = null;
  let storageOk = true;

  function defaults() {
    return {
      v: 1,
      xp: 0,
      nodes: {},          // nodeId -> {done, stars, attempts, firstTry, checks, step}
      weak: {},           // qid -> {nodeId, concept, misses, ts}
      streak: { count: 0, last: '' },
      daily: {},          // dateStr -> {qid, done, correct}
      dailyDone: 0,
      achievements: [],
      settings: { sound: true, motion: true, codeSize: 'm' },
      practiceCleared: 0,
      createdAt: new Date().toISOString(),
    };
  }

  /* ---- safe persistence ---- */
  function rawLoad() {
    try {
      const s = window.localStorage.getItem(KEY);
      return s ? JSON.parse(s) : null;
    } catch (e) {
      storageOk = false;
      return memoryFallback ? JSON.parse(memoryFallback) : null;
    }
  }

  function rawSave(obj) {
    const json = JSON.stringify(obj);
    try {
      window.localStorage.setItem(KEY, json);
      storageOk = true;
    } catch (e) {
      storageOk = false;
      memoryFallback = json;
    }
  }

  // Merge loaded data over defaults so missing/renamed fields never crash.
  function sanitize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const s = { ...d, ...raw };
    s.xp = Number.isFinite(s.xp) && s.xp >= 0 ? Math.floor(s.xp) : 0;
    s.nodes = (s.nodes && typeof s.nodes === 'object') ? s.nodes : {};
    s.weak = (s.weak && typeof s.weak === 'object') ? s.weak : {};
    s.daily = (s.daily && typeof s.daily === 'object') ? s.daily : {};
    s.streak = (s.streak && typeof s.streak === 'object') ? { count: s.streak.count | 0, last: String(s.streak.last || '') } : d.streak;
    s.achievements = Array.isArray(s.achievements) ? s.achievements.filter((a) => typeof a === 'string') : [];
    s.settings = { ...d.settings, ...(s.settings && typeof s.settings === 'object' ? s.settings : {}) };
    s.dailyDone = s.dailyDone | 0;
    s.practiceCleared = s.practiceCleared | 0;
    if (!['s', 'm', 'l'].includes(s.settings.codeSize)) s.settings.codeSize = 'm';
    // deep-clean per-entry shapes so a hand-edited import can't poison renders
    const nodes = {};
    for (const [k, v] of Object.entries(s.nodes)) {
      if (v && typeof v === 'object') {
        nodes[k] = {
          done: !!v.done,
          stars: Math.max(0, Math.min(3, v.stars | 0)),
          attempts: Math.max(0, v.attempts | 0),
          firstTry: Math.max(0, v.firstTry | 0),
          checks: Math.max(0, v.checks | 0),
          step: Math.max(0, v.step | 0),
        };
      }
    }
    s.nodes = nodes;
    const weak = {};
    for (const [k, v] of Object.entries(s.weak)) {
      if (v && typeof v === 'object') {
        weak[k] = {
          nodeId: String(v.nodeId || ''),
          concept: String(v.concept || ''),
          misses: Math.max(0, v.misses | 0),
          ts: Number.isFinite(v.ts) ? v.ts : 0,
        };
      }
    }
    s.weak = weak;
    const daily = {};
    for (const [k, v] of Object.entries(s.daily)) {
      if (v && typeof v === 'object') {
        daily[k] = { qid: typeof v.qid === 'string' ? v.qid : null, done: !!v.done, correct: !!v.correct };
      }
    }
    s.daily = daily;
    return s;
  }

  let state = sanitize(rawLoad());

  function save() { rawSave(state); }

  /* ---- date helpers ---- */
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function touchStreak() {
    const today = todayStr();
    const last = state.streak.last;
    if (last === today) return;
    if (last) {
      const diff = Math.round((new Date(today) - new Date(last)) / 86400000);
      state.streak.count = (diff === 1) ? state.streak.count + 1 : 1;
    } else {
      state.streak.count = 1;
    }
    state.streak.last = today;
    if (state.streak.count >= 3) grant('hot_streak');
    if (state.streak.count >= 7) grant('studio_regular');
    save();
  }

  /* ---- XP & levels ---- */
  function level() {
    let lv = 1;
    for (let i = 0; i < LEVELS.length; i++) if (state.xp >= LEVELS[i]) lv = i + 1;
    return lv;
  }

  function levelTitle() { return LEVEL_TITLES[Math.min(level() - 1, LEVEL_TITLES.length - 1)]; }

  function levelProgress() {
    const lv = level();
    const base = LEVELS[lv - 1];
    const next = LEVELS[lv] !== undefined ? LEVELS[lv] : null;
    if (next === null) return { pct: 100, into: 0, span: 0, next: null };
    return { pct: Math.min(100, Math.round(((state.xp - base) / (next - base)) * 100)), into: state.xp - base, span: next - base, next };
  }

  function addXp(amount) {
    const before = level();
    state.xp += Math.max(0, Math.round(amount));
    if (state.xp >= 100) grant('signal_present');
    if (level() >= 5) grant('level_5');
    touchStreak();
    save();
    return { leveledUp: level() > before, level: level() };
  }

  /* ---- nodes ---- */
  function nodeState(id) {
    if (!state.nodes[id]) state.nodes[id] = { done: false, stars: 0, attempts: 0, firstTry: 0, checks: 0, step: 0 };
    return state.nodes[id];
  }

  function isDone(id) { return !!(state.nodes[id] && state.nodes[id].done); }

  // Sequential unlock within a zone. Everything before the first
  // incomplete node is replayable; the first incomplete node is next.
  function isUnlocked(zoneId, nodeId) {
    const order = (ZONES.find((z) => z.id === zoneId) || {}).nodeOrder || [];
    for (const id of order) {
      if (id === nodeId) return true;
      if (!isDone(id)) return false;
    }
    return false;
  }

  function nextNode() {
    const order = ZONES[0].nodeOrder;
    for (const id of order) if (!isDone(id)) return id;
    return null;
  }

  function starsFor(firstTry, checks) {
    if (checks <= 0) return 1;
    const f = firstTry / checks;
    if (f >= 0.999) return 3;
    if (f >= 0.66) return 2;
    return 1;
  }

  function completeNode(id, firstTry, checks) {
    const ns = nodeState(id);
    const stars = starsFor(firstTry, checks);
    const firstCompletion = !ns.done;
    ns.done = true;
    ns.attempts += 1;
    ns.firstTry = firstTry;
    ns.checks = checks;
    ns.stars = Math.max(ns.stars, stars);
    ns.step = 0;
    const node = Engine.NODES[id];
    if (node) {
      if (node.kind === 'lesson') {
        grant('power_on');
        if (stars === 3) grant('clean_take');
      }
      if (id === 'p1') grant('gain_staged');
      if (id === 'p2') grant('osc_online');
      if (id === 'boss1') grant('zone1_clear');
      if (node.ctype === 'bugfix' && ['b1', 'b2', 'b3', 'b4'].every(isDone)) grant('bug_squasher');
      if (node.ctype === 'compiler' && ['e1', 'e2', 'e3'].every(isDone)) grant('error_reader');
    }
    save();
    return { stars, firstCompletion };
  }

  function setProjectStep(id, step) {
    nodeState(id).step = step;
    save();
  }

  /* ---- weak topics / practice ---- */
  function markWeak(qid, nodeId, concept) {
    const w = state.weak[qid] || { nodeId, concept, misses: 0, ts: 0 };
    w.misses += 1;
    w.ts = Date.now();
    w.concept = concept || w.concept;
    state.weak[qid] = w;
    save();
  }

  function clearWeak(qid) {
    if (state.weak[qid]) {
      delete state.weak[qid];
      state.practiceCleared += 1;
      save();
    }
  }

  function weakList() {
    return Object.entries(state.weak)
      .map(([qid, w]) => ({ qid, ...w }))
      .filter((w) => Engine.QINDEX[w.qid])
      .sort((a, b) => b.misses - a.misses || b.ts - a.ts);
  }

  function weakConcepts() {
    const counts = {};
    for (const w of weakList()) counts[w.concept] = (counts[w.concept] || 0) + 1;
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([c, n]) => ({ concept: c, n }));
  }

  /* ---- daily ---- */
  function dailyToday() {
    const t = todayStr();
    if (!state.daily[t]) {
      const qid = Engine.dailyQid(t);
      state.daily[t] = { qid, done: false, correct: false };
      save();
    }
    return { date: t, ...state.daily[t] };
  }

  function completeDaily(dateStr, correct) {
    const t = dateStr || todayStr();
    if (state.daily[t] && !state.daily[t].done) {
      state.daily[t].done = true;
      state.daily[t].correct = !!correct;
      state.dailyDone += 1;
      if (state.dailyDone >= 5) grant('daily_driver');
      save();
    }
  }

  /* ---- achievements ---- */
  let achQueue = [];
  function grant(id) {
    if (!ACHIEVEMENTS.some((a) => a.id === id)) return;
    if (state.achievements.includes(id)) return;
    state.achievements.push(id);
    achQueue.push(id);
    save();
  }
  function drainAchievements() { const q = achQueue; achQueue = []; return q; }

  /* ---- mastery ---- */
  function zoneMastery() {
    const lessons = ZONE1_LESSONS.map((l) => l.id);
    const doneLessons = lessons.filter(isDone);
    if (doneLessons.length === 0) return { pct: 0, avgStars: 0, doneLessons: 0, totalLessons: lessons.length };
    const totalStars = doneLessons.reduce((s, id) => s + (state.nodes[id].stars || 0), 0);
    const avg = totalStars / doneLessons.length;
    return {
      pct: Math.round((totalStars / (lessons.length * 3)) * 100),
      avgStars: avg,
      doneLessons: doneLessons.length,
      totalLessons: lessons.length,
    };
  }

  function bossReady() {
    const m = zoneMastery();
    const lessonsDone = m.doneLessons === m.totalLessons;
    const projectsDone = isDone('p1') && isDone('p2');
    return { ready: lessonsDone && projectsDone && m.avgStars >= 2, lessonsDone, projectsDone, avgStars: m.avgStars, need: 2 };
  }

  /* ---- settings / io ---- */
  function setSetting(k, v) { state.settings[k] = v; save(); }

  function exportJson() { return JSON.stringify(state, null, 2); }

  function importJson(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'That isn\'t valid JSON — paste the exact text from Export Progress.' }; }
    if (!obj || typeof obj !== 'object' || typeof obj.xp !== 'number') {
      return { ok: false, error: 'That JSON doesn\'t look like TXPPS progress data (missing xp field).' };
    }
    state = sanitize(obj);
    save();
    return { ok: true };
  }

  function reset() {
    state = defaults();
    try { window.localStorage.removeItem(KEY); } catch (e) { /* fallback mode */ }
    memoryFallback = null;
    save();
  }

  return {
    get state() { return state; },
    get storageOk() { return storageOk; },
    save, todayStr, touchStreak,
    level, levelTitle, levelProgress, addXp,
    nodeState, isDone, isUnlocked, nextNode, completeNode, setProjectStep, starsFor,
    markWeak, clearWeak, weakList, weakConcepts,
    dailyToday, completeDaily,
    grant, drainAchievements,
    zoneMastery, bossReady,
    setSetting, exportJson, importJson, reset,
  };
})();

/* ===== src/js/audio.js ===== */
/* ============================================================
   Feedback tones — tiny WebAudio blips. Created lazily on first
   user gesture (iOS requirement); fully optional via Settings.
   ============================================================ */

const Sfx = (() => {
  let ctx = null;

  function ensure() {
    if (!Store.state.settings.sound) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }

  function blip(freq, time, dur, type, gain) {
    const c = ensure();
    if (!c) return;
    try {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(gain || 0.08, time + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(c.destination);
      o.start(time);
      o.stop(time + dur + 0.02);
    } catch (e) { /* sound is never worth crashing over */ }
  }

  return {
    tap()     { const c = ensure(); if (c) blip(880, c.currentTime, 0.05, 'sine', 0.03); },
    correct() { const c = ensure(); if (c) { blip(660, c.currentTime, 0.09, 'sine', 0.07); blip(990, c.currentTime + 0.07, 0.14, 'sine', 0.07); } },
    wrong()   { const c = ensure(); if (c) blip(140, c.currentTime, 0.16, 'square', 0.04); },
    levelUp() { const c = ensure(); if (c) { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => blip(f, c.currentTime + i * 0.09, 0.18, 'triangle', 0.07)); } },
  };
})();

/* ===== src/js/ui.js ===== */
/* ============================================================
   UI helpers — element builder, markup formatter, C++ highlighter,
   shared widgets (code panel, stars, toast, sheet, scope canvas).
   ============================================================ */

const UI = (() => {

  /* ---- element builder ---- */
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(node.dataset, v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const c of children.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---- inline markup: `code` and **bold** ---- */
  function fmt(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return s;
  }

  /* ---- minimal C++ syntax highlighter (regex, single pass) ---- */
  const CPP_KW = /\b(class|struct|public|private|protected|const|constexpr|return|if|else|switch|case|break|default|for|while|do|void|float|double|int|bool|char|auto|true|false|nullptr|new|delete|this|namespace|using|static|enum|template|typename)\b/g;

  function highlightCpp(code) {
    const src = String(code);
    let out = '';
    let i = 0;
    const n = src.length;
    while (i < n) {
      const rest = src.slice(i);
      let m;
      if ((m = rest.match(/^\/\/[^\n]*/))) {
        out += '<span class="tok-com">' + escapeHtml(m[0]) + '</span>'; i += m[0].length;
      } else if ((m = rest.match(/^"(?:[^"\\\n]|\\.)*"/))) {
        out += '<span class="tok-str">' + escapeHtml(m[0]) + '</span>'; i += m[0].length;
      } else if ((m = rest.match(/^#\s*\w+/))) {
        out += '<span class="tok-pre">' + escapeHtml(m[0]) + '</span>'; i += m[0].length;
      } else if ((m = rest.match(/^\b\d+\.?\d*f?F?\b/))) {

  };

  function render(spec) {
    const gen = GEN[spec.t];
    const wrap = document.createElement('div');
    wrap.className = 'viz-wrap';
    wrap.setAttribute('aria-hidden', 'true');
    if (!gen) return wrap;
    try {
      const { svg, h } = gen(spec);
      wrap.innerHTML = `<svg viewBox="0 0 340 ${h}" preserveAspectRatio="xMidYMid meet">${svg}</svg>` +
        (spec.cap ? `<div class="viz-cap">${esc(spec.cap)}</div>` : '');
    } catch (e) { /* a broken diagram must never break a lesson */ }
    return wrap;
  }

  return { render };
